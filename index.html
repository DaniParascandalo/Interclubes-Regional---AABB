<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Interclubes Regional - AABBM</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

/* =====================================================
   CONFIGURAÇÃO GERAL
===================================================== */

    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;

/* =====================================================
   CABEÇALHO

header {

    padding: 35px 20px;

   CONTAINER

   FILTRO
===================================================== */

.menu {

.select-categoria {

}

.select-categoria:focus {
    outline: none;

/* =====================================================
   RESUMO
===================================================== */

.resumo {
    background: white;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.resumo h2 {
    margin: 0 0 8px;
    font-size: 28px;
}

.contador {
    font-size: 30px;

/* =====================================================
   TABELA

.categoria {

/* =====================================================
   TORNEIOS

    color: #ff0000 !important;

}


/* =====================================================
   MENSAGENS
===================================================== */

.vazio {
    background: white;
    border-radius: 14px;
    padding: 45px;
    text-align: center;
    color: #555;
}

.carregando {
    background: white;
    border-radius: 14px;
    padding: 45px;
    text-align: center;
}

.erro {
    background: #fee2e2;
    color: #991b1b;
    padding: 20px;
    border-radius: 10px;
}


/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width:700px) {

    header h1 {
        font-size: 24px;
    }

    .container {
        padding: 0 10px;
    }

    .select-categoria {
        max-width: 100%;
    }

    table {
        font-size: 13px;
    }

    th,
    td {
        padding: 8px;
    }

}

</style>

</head>


<body>


<header>

    <h1>🏆 Interclubes Regional</h1>

    <p>AABBM</p>

</header>


<div class="container">


<!-- =====================================================
     FILTRO
===================================================== -->

<div class="menu">

    <label
        class="label-categoria"
        for="selectCategoria"
    >
        CATEGORIA
    </label>


    <select
        id="selectCategoria"
        class="select-categoria"
        onchange="selecionarCategoria()"
    >

        <option value="">
            Selecione uma categoria
        </option>

    </select>

</div>


<!-- =====================================================
     RESUMO
===================================================== -->

<div class="resumo">

    <h2 id="titulo">
        Selecione uma categoria
    </h2>

    <div
        class="contador"
        id="contador"
    >
        0
    </div>

    <input
        id="busca"
        class="busca"
        type="text"
        placeholder="🔎 Pesquisar atleta..."
    >

</div>


<!-- =====================================================
     CONTEÚDO
===================================================== -->

<div id="conteudo">

    <div class="carregando">
        Carregando planilha...
    </div>

</div>


</div>


<script>


/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const arquivoExcel =
    "IC26BT - REGIONAL - AABBM.xlsx";


let todosAtletas = [];

let categoriasDisponiveis = [];

let categoriaAtual = "";


/* =====================================================
   CATEGORIAS EXATAMENTE COMO ESTÃO NA PLANILHA
===================================================== */

const ordemCategorias = [

    "Profissional Feminino",
    "Profissional Masculino",

    "A Feminino",
    "A Masculino",

    "B Feminino",
    "B Masculino",

    "C Feminino",
    "C Masculino",

    "D Feminino",
    "D Masculino",

    "E Feminino",
    "E Masculino",

    "40+ Feminino",
    "40+ Masculino",

    "50+ Feminino",
    "50+ Masculino",

    "60+ Feminino",
    "60+ Masculino",

    "Categoria Sub 10 - Mista",

    "Sub12 Feminino",
    "Sub12 Masculino",

    "Sub14 Feminino",
    "Sub14 Masculino",

    "Sub16 Feminino",
    "Sub16 Masculino",

    "Sub18 Feminino",
    "Sub18 Masculino"

];


/* =====================================================
   NORMALIZAR TEXTO
===================================================== */

function normalizar(texto) {

    return String(texto || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        );

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHtml(valor) {

    return String(valor ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =====================================================
   CONVERTER TORNEIOS
===================================================== */

function numeroTorneios(valor) {

    if (
        valor === null ||
        valor === undefined ||
        String(valor).trim() === ""
    ) {

        return null;

    }


    const numero =
        Number(
            String(valor)
                .replace(",", ".")
                .trim()
        );


    if (
        isNaN(numero)
    ) {

        return null;

    }


    return numero;

}


/* =====================================================
   TORNEIOS EM VERMELHO
===================================================== */

function classeTorneios(valor) {

    const numero =
        numeroTorneios(valor);


    /*
       0 ou 1 = vermelho
       2 ou mais = normal
    */

    if (
        numero !== null &&
        numero < 2
    ) {

        return "torneios-alerta";

    }


    return "";

}


/* =====================================================
   VERIFICAR SE É CABEÇALHO
===================================================== */

function ehCabecalho(
    linha,
    inicio
) {

    const codigo =
        normalizar(
            linha[inicio]
        );


    const nome =
        normalizar(
            linha[inicio + 1]
        );


    return (
        codigo === "codigo" ||
        nome === "nome"
    );

}


/* =====================================================
   IDENTIFICAR TÍTULO DO BLOCO
===================================================== */

function identificarCategoria(
    valor
) {

    const texto =
        String(
            valor || ""
        ).trim();


    if (
        !texto
    ) {

        return "";

    }


    const encontrada =
        ordemCategorias.find(
            categoria =>
                normalizar(categoria) ===
                normalizar(texto)
        );


    return encontrada || "";

}


/* =====================================================
   ADICIONAR ATLETA
===================================================== */

function adicionarAtleta(
    linha,
    inicio,
    categoria
) {

    /*
       Estrutura da planilha:

       Código
       Nome
       Clube
       Categoria
       Idade
       Confirmação
       Torneios
    */


    if (
        ehCabecalho(
            linha,
            inicio
        )
    ) {

        return;

    }


    const codigo =
        linha[inicio] || "";


    const nome =
        linha[inicio + 1] || "";


    const clube =
        linha[inicio + 2] || "";


    const categoriaPlanilha =
        linha[inicio + 3] || "";


    const idade =
        linha[inicio + 4] || "";


    const confirmacao =
        linha[inicio + 5] || "";


    const torneios =
        linha[inicio + 6] || "";


    /*
       Ignora linhas vazias
    */

    if (
        !nome ||
        String(nome).trim() === ""
    ) {

        return;

    }


    /*
       Ignora novamente qualquer
       linha que seja cabeçalho
    */

    if (
        normalizar(nome) === "nome"
    ) {

        return;

    }


    todosAtletas.push({

        codigo:
            codigo,

        nome:
            nome,

        clube:
            clube,

        categoria:
            categoria,

        categoriaPlanilha:
            categoriaPlanilha,

        idade:
            idade,

        confirmacao:
            confirmacao,

        torneios:
            torneios

    });

}


/* =====================================================
   LER UMA SEÇÃO DA PLANILHA
===================================================== */

function lerSecao(
    linhas,
    inicio,
    fim,
    coluna,
    categoria
) {

    /*
       O cabeçalho fica logo abaixo
       do título.

       Exemplo:

       A Feminino
       Código | Nome | Clube | ...

       depois vêm os atletas.
    */


    for (
        let r = inicio;
        r < fim;
        r++
    ) {

        const linha =
            linhas[r];


        adicionarAtleta(
            linha,
            coluna,
            categoria
        );

    }

}


/* =====================================================
   LER ABA GERAL
===================================================== */

function lerGeral(
    sheet
) {

    const linhas =
        XLSX.utils.sheet_to_json(
            sheet,
            {
                header: 1,
                defval: ""
            }
        );


    /*
       Localizar todos os títulos
       dos blocos da planilha.
    */

    const secoes = [];


    for (
        let r = 0;
        r < linhas.length;
        r++
    ) {

        /*
           Feminino
           coluna A
        */

        const categoriaFeminino =
            identificarCategoria(
                linhas[r][0]
            );


        if (
            categoriaFeminino
        ) {

            secoes.push({

                linha:
                    r,

                coluna:
                    0,

                categoria:
                    categoriaFeminino

            });

        }


        /*
           Masculino
           coluna H
        */

        const categoriaMasculino =
            identificarCategoria(
                linhas[r][7]
            );


        if (
            categoriaMasculino
        ) {

            secoes.push({

                linha:
                    r,

                coluna:
                    7,

                categoria:
                    categoriaMasculino

            });

        }

    }


    /*
       Ler cada bloco somente até
       o próximo título daquela coluna.
    */

    secoes.forEach(
        secao => {

            let fim =
                linhas.length;


            for (
                let r = secao.linha + 1;
                r < linhas.length;
                r++
            ) {

                const proximaCategoria =
                    identificarCategoria(
                        linhas[r][secao.coluna]
                    );


                if (
                    proximaCategoria
                ) {

                    fim = r;

                    break;

                }

            }


            /*
               +2:

               pula a linha do título
               e a linha do cabeçalho.
            */

            lerSecao(
                linhas,
                secao.linha + 2,
                fim,
                secao.coluna,
                secao.categoria
            );

        }
    );

}


/* =====================================================
   LER ABA SUBS
===================================================== */

function lerSubs(
    sheet
) {

    const linhas =
        XLSX.utils.sheet_to_json(
            sheet,
            {
                header: 1,
                defval: ""
            }
        );


    const secoes = [];


    for (
        let r = 0;
        r < linhas.length;
        r++
    ) {

        /*
           Feminino / Mista
           coluna A
        */

        const categoriaFeminino =
            identificarCategoria(
                linhas[r][0]
            );


        if (
            categoriaFeminino
        ) {

            secoes.push({

                linha:
                    r,

                coluna:
                    0,

                categoria:
                    categoriaFeminino

            });

        }


        /*
           Masculino
           coluna H
        */

        const categoriaMasculino =
            identificarCategoria(
                linhas[r][7]
            );


        if (
            categoriaMasculino
        ) {

            secoes.push({

                linha:
                    r,

                coluna:
                    7,

                categoria:
                    categoriaMasculino

            });

        }

    }


    /*
       Ler cada seção
    */

    secoes.forEach(
        secao => {

            let fim =
                linhas.length;


            for (
                let r = secao.linha + 1;
                r < linhas.length;
                r++
            ) {

                const proximaCategoria =
                    identificarCategoria(
                        linhas[r][secao.coluna]
                    );


                if (
                    proximaCategoria
                ) {

                    fim = r;

                    break;

                }

            }


            /*
               pula título + cabeçalho
            */

            lerSecao(
                linhas,
                secao.linha + 2,
                fim,
                secao.coluna,
                secao.categoria
            );

        }
    );

}


/* =====================================================
   REMOVER DUPLICADOS
===================================================== */

function removerDuplicados(
    lista
) {

    const mapa =
        new Map();


    lista.forEach(
        atleta => {

            const chave =
                normalizar(
                    atleta.categoria
                ) +
                "|" +
                String(
                    atleta.codigo || ""
                ).trim() +
                "|" +
                normalizar(
                    atleta.nome
                );


            if (
                !mapa.has(chave)
            ) {

                mapa.set(
                    chave,
                    atleta
                );

            }

        }
    );


    return Array.from(
        mapa.values()
    );

}


/* =====================================================
   CRIAR FILTRO
===================================================== */

function criarFiltro() {

    const select =
        document.getElementById(
            "selectCategoria"
        );


    select.innerHTML = "";


    /*
       OPÇÃO INICIAL
    */

    const inicial =
        document.createElement(
            "option"
        );


    inicial.value =
        "";


    inicial.textContent =
        "Selecione uma categoria";


    select.appendChild(
        inicial
    );


    /*
       Pegar somente categorias
       que realmente possuem atletas
    */

    categoriasDisponiveis =
        [
            ...new Set(
                todosAtletas
                    .map(
                        atleta =>
                            atleta.categoria
                    )
                    .filter(
                        categoria =>
                            categoria
                    )
            )
        ];


    /*
       Ordenar na mesma ordem
       da planilha
    */

    categoriasDisponiveis.sort(
        (a, b) => {

            const posA =
                ordemCategorias.indexOf(a);

            const posB =
                ordemCategorias.indexOf(b);


            if (
                posA === -1 &&
                posB === -1
            ) {

                return a.localeCompare(
                    b,
                    "pt-BR"
                );

            }


            if (
                posA === -1
            ) {

                return 1;

            }


            if (
                posB === -1
            ) {

                return -1;

            }


            return posA - posB;

        }
    );


    /*
       Criar opções
    */

    categoriasDisponiveis.forEach(
        categoria => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                categoria;


            option.textContent =
                categoria;


            select.appendChild(
                option
            );

        }
    );


    console.log(
        "Categorias encontradas:",
        categoriasDisponiveis
    );

}


/* =====================================================
   SELECIONAR CATEGORIA
===================================================== */

function selecionarCategoria() {

    categoriaAtual =
        document.getElementById(
            "selectCategoria"
        ).value;


    mostrar();

}


/* =====================================================
   MOSTRAR
===================================================== */

function mostrar() {

    const busca =
        normalizar(
            document.getElementById(
                "busca"
            ).value
        );


    /*
       Nenhuma categoria selecionada
    */

    if (
        !categoriaAtual
    ) {

        document.getElementById(
            "titulo"
        ).textContent =
            "Selecione uma categoria";


        document.getElementById(
            "contador"
        ).textContent =
            "0";


        document.getElementById(
            "conteudo"
        ).innerHTML = `

            <div class="vazio">

                Selecione uma categoria acima.

            </div>

        `;

        return;

    }


    /*
       FILTRAR EXATAMENTE
       A CATEGORIA SELECIONADA
    */

    let lista =
        todosAtletas.filter(
            atleta =>
                normalizar(
                    atleta.categoria
                ) ===
                normalizar(
                    categoriaAtual
                )
        );


    /*
       PESQUISA
    */

    if (
        busca
    ) {

        lista =
            lista.filter(
                atleta => {

                    const texto =
                        normalizar(
                            [
                                atleta.codigo,
                                atleta.nome,
                                atleta.clube,
                                atleta.categoria,
                                atleta.categoriaPlanilha,
                                atleta.idade,
                                atleta.torneios
                            ].join(" ")
                        );


                    return texto.includes(
                        busca
                    );

                }
            );

    }


    /*
       TÍTULO
    */

    document.getElementById(
        "titulo"
    ).textContent =
        "Inscritos - " +
        categoriaAtual;


    /*
       CONTADOR
    */

    document.getElementById(
        "contador"
    ).textContent =
        lista.length;


    /*
       TABELA
    */

    renderizarTabela(
        lista
    );

}


/* =====================================================
   RENDERIZAR TABELA
===================================================== */

function renderizarTabela(
    lista
) {

    const conteudo =
        document.getElementById(
            "conteudo"
        );


    if (
        lista.length === 0
    ) {

        conteudo.innerHTML = `

            <div class="vazio">

                Nenhum atleta encontrado.

            </div>

        `;

        return;

    }


    let html = `

        <div class="categoria">

            <div class="categoria-titulo">

                Inscritos -
                ${escaparHtml(
                    categoriaAtual
                )}

            </div>


            <table>

                <thead>

                    <tr>

                        <th>
                            Código
                        </th>

                        <th>
                            Nome
                        </th>

                        <th>
                            Clube
                        </th>

                        <th>
                            Categoria
                        </th>

                        <th>
                            Idade
                        </th>

                        <th>
                            Torneios
                        </th>

                        <th>
                            Status
                        </th>

                    </tr>

                </thead>


                <tbody>

    `;


    lista.forEach(
        atleta => {

            const classe =
                classeTorneios(
                    atleta.torneios
                );


            html += `

                <tr>

                    <td>
                        ${escaparHtml(
                            atleta.codigo
                        )}
                    </td>


                    <td>

                        <strong>

                            ${escaparHtml(
                                atleta.nome
                            )}

                        </strong>

                    </td>


                    <td>
                        ${escaparHtml(
                            atleta.clube
                        )}
                    </td>


                    <td>
                        ${escaparHtml(
                            atleta.categoriaPlanilha
                        )}
                    </td>


                    <td>
                        ${escaparHtml(
                            atleta.idade
                        )}
                    </td>


                    <td
                        class="${classe}"
                    >

                        ${escaparHtml(
                            atleta.torneios
                        )}

                    </td>


                    <td>
                        ${escaparHtml(
                            atleta.confirmacao
                        )}
                    </td>

                </tr>

            `;

        }
    );


    html += `

                </tbody>

            </table>

        </div>

    `;


    conteudo.innerHTML =
        html;

}


/* =====================================================
   PESQUISA
===================================================== */

document
    .getElementById(
        "busca"
    )
    .addEventListener(
        "input",
        function() {

            mostrar();

        }
    );


/* =====================================================
   INICIAR
===================================================== */

async function iniciar() {

    try {

        /*
           CARREGAR PLANILHA
        */

        const resposta =
            await fetch(
                arquivoExcel +
                "?v=" +
                Date.now()
            );


        if (
            !resposta.ok
        ) {

            throw new Error(
                "Não foi possível carregar a planilha."
            );

        }


        const dados =
            await resposta.arrayBuffer();


        const workbook =
            XLSX.read(
                dados,
                {
                    type: "array"
                }
            );


        console.log(
            "Abas encontradas:",
            workbook.SheetNames
        );


        /*
           LIMPAR
        */

        todosAtletas = [];


        /*
           LER SOMENTE GERAL
        */

        if (
            workbook.SheetNames.includes(
                "Geral"
            )
        ) {

            lerGeral(
                workbook.Sheets[
                    "Geral"
                ]
            );

        }
        else {

            throw new Error(
                "A aba Geral não foi encontrada."
            );

        }


        /*
           LER SOMENTE SUBS
        */

        if (
            workbook.SheetNames.includes(
                "Subs"
            )
        ) {

            lerSubs(
                workbook.Sheets[
                    "Subs"
                ]
            );

        }
        else {

            throw new Error(
                "A aba Subs não foi encontrada."
            );

        }


        /*
           REMOVER DUPLICADOS
        */

        todosAtletas =
            removerDuplicados(
                todosAtletas
            );


        console.log(
            "Total carregado de Geral + Subs:",
            todosAtletas.length
        );


        /*
           CONTAGEM POR CATEGORIA
        */

        const contagem = {};


        todosAtletas.forEach(
            atleta => {

                if (
                    !contagem[
                        atleta.categoria
                    ]
                ) {

                    contagem[
                        atleta.categoria
                    ] = 0;

                }


                contagem[
                    atleta.categoria
                ]++;

            }
        );


        console.log(
            "Contagem por categoria:",
            contagem
        );


        /*
           CRIAR FILTRO
        */

        criarFiltro();


        /*
           ESTADO INICIAL
        */

        document.getElementById(
            "titulo"
        ).textContent =
            "Selecione uma categoria";


        document.getElementById(
            "contador"
        ).textContent =
            "0";


        document.getElementById(
            "conteudo"
        ).innerHTML = `

            <div class="vazio">

                Selecione uma categoria acima.

            </div>

        `;

    }


    catch (erro) {

        console.error(
            erro
        );


        document.getElementById(
            "conteudo"
        ).innerHTML = `

            <div class="erro">

                <strong>
                    Erro ao carregar os dados.
                </strong>

                <br><br>

                ${escaparHtml(
                    erro.message
                )}

            </div>

        `;

    }

}


/* =====================================================
   EXECUTAR
===================================================== */

iniciar();

</script>

</body>

</html>
