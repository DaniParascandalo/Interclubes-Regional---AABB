<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Interclubes Regional - AABBM</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

/* =====================================================
   GERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f5f7;
    color: #172033;
}

header {
    background: #111827;
    color: white;
    padding: 35px 20px;
    text-align: center;
}

    margin: 0;
    font-size: 32px;
}

    margin: 8px 0 0;
    font-size: 18px;
    opacity: .85;
}

    max-width: 1400px;

    padding: 0 18px;

   MENU / FILTRO
===================================================== */

.menu {
    background: white;
    border-radius: 14px;

.select-categoria {

    padding: 13px 15px;

    border-radius: 9px;

    cursor: pointer;
}

.select-categoria:focus {
    outline: none;
    border-color: #0f766e;
    box-shadow: 0 0 0 2px rgba(15,118,110,.15);
}


/* =====================================================
   RESUMO
===================================================== */

.resumo {
    background: white;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.resumo h2 {
    margin: 0 0 8px;
    font-size: 28px;
}

.contador {
    font-size: 30px;
    font-weight: bold;
    color: #0f766e;
}

.busca {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: 1px solid #d1d5db;
    border-radius: 9px;

}

.busca:focus {
    outline: none;

}


/* =====================================================
   TABELA
===================================================== */

.categoria {

}

table {

}

th {
    background: #e5e7eb;

    text-align: left;

}

td {
    padding: 12px;
    border-top: 1px solid #eeeeee;
}

tr:hover {

}


/* =====================================================
   TORNEIOS
===================================================== */

.torneios-alerta {
    color: red !important;
    font-weight: bold;
}


/* =====================================================
   STATUS
===================================================== */

.status {

}


/* =====================================================
   MENSAGENS
===================================================== */

.vazio {
    background: white;

    padding: 45px;

}

.carregando {
    background: white;
    border-radius: 14px;
    padding: 45px;
    text-align: center;
}

.erro {
    background: #fee2e2;
    color: #991b1b;
    padding: 20px;
    border-radius: 10px;
}


/* =====================================================
   CELULAR
===================================================== */

@media(max-width:700px) {

    header h1 {
        font-size: 24px;
    }

    .container {
        padding: 0 10px;
    }

    .select-categoria {
        max-width: 100%;
    }

    table {
        font-size: 13px;
    }

    th,

        padding: 8px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     CABEÇALHO
===================================================== -->

<header>

    <h1>🏆 Interclubes Regional</h1>

    <p>AABBM</p>

</header>


<div class="container">


<!-- =====================================================
     FILTRO
===================================================== -->

<div class="menu">

    <button
        id="botaoTodos"
        class="botao-todos ativo"
        onclick="mostrarTodos()"
    >
        📋 TODOS OS ATLETAS
    </button>


    <label
        class="label-categoria"
        for="selectCategoria"
    >
        CATEGORIA
    </label>


    <select
        id="selectCategoria"
        class="select-categoria"
        onchange="selecionarCategoria()"
    >

        <option value="TODOS">
            Todos os inscritos
        </option>

    </select>

</div>


<!-- =====================================================
     RESUMO
===================================================== -->

<div class="resumo">

    <h2 id="titulo">
        Atletas inscritos
    </h2>

    <div
        class="contador"
        id="contador"
    >
        0
    </div>

    <input
        id="busca"
        class="busca"
        placeholder="🔎 Pesquisar atleta..."
    >

</div>


<!-- =====================================================
     CONTEÚDO
===================================================== -->

<div id="conteudo">

    <div class="carregando">
        Carregando planilha...
    </div>

</div>


</div>


<script>


/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const arquivoExcel =
    "IC26BT - REGIONAL - AABBM.xlsx";


let todosAtletas = [];

let categoriaAtual = "TODOS";


/* =====================================================
   NORMALIZAR TEXTO
===================================================== */

function normalizar(texto) {

    return String(texto || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHtml(valor) {

    return String(valor ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =====================================================
   TRANSFORMAR CATEGORIA DA PLANILHA
=====================================================

   Exemplos:

   BTFA → Categoria A
   BTMA → Categoria A

   BTFB → Categoria B
   BTMB → Categoria B

   BTFC → Categoria C
   BTMC → Categoria C

   BTFD → Categoria D
   BTMD → Categoria D

   BTFE → Categoria E
   BTME → Categoria E

===================================================== */

function transformarCategoria(valor) {

    const texto =
        String(valor || "")
            .trim()
            .toUpperCase();


    if (!texto) {

        return "";

    }


    /* =========================================
       SE JÁ ESTIVER COMO CATEGORIA A
       Categoria B etc.
    ========================================= */

    const categoriaDireta =
        texto.match(
            /^CATEGORIA\s+([A-Z0-9]+)/
        );


    if (categoriaDireta) {

        return "Categoria " +
            categoriaDireta[1];

    }


    /* =========================================
       CATEGORIAS BTFA / BTMA / BTFB / BTMB
    ========================================= */

    const categoriaBT =
        texto.match(
            /^BT[A-Z]([A-Z0-9])$/
        );


    if (categoriaBT) {

        return "Categoria " +
            categoriaBT[1];

    }


    /* =========================================
       OUTROS FORMATOS QUE TERMINAM EM LETRA
    ========================================= */

    const ultimaLetra =
        texto.match(
            /([A-Z])$/
        );


    if (
        ultimaLetra &&
        texto.length >= 2
    ) {

        const letra =
            ultimaLetra[1];

        return "Categoria " +
            letra;

    }


    return texto;

}


/* =====================================================
   LER VALOR DE UMA COLUNA
===================================================== */

function pegarValor(objeto, nomes) {

    for (
        let i = 0;
        i < nomes.length;
        i++
    ) {

        const nome =
            nomes[i];


        if (
            Object.prototype.hasOwnProperty.call(
                objeto,
                nome
            )
        ) {

            const valor =
                objeto[nome];


            if (
                valor !== undefined &&
                valor !== null &&
                String(valor).trim() !== ""
            ) {

                return valor;

            }

        }

    }


    return "";

}


/* =====================================================
   LOCALIZAR COLUNA POR NOME
===================================================== */

function localizarColuna(
    objeto,
    palavras
) {

    const chaves =
        Object.keys(objeto);


    for (
        let i = 0;
        i < chaves.length;
        i++
    ) {

        const chave =
            chaves[i];


        const chaveNormalizada =
            normalizar(chave);


        for (
            let j = 0;
            j < palavras.length;
            j++
        ) {

            if (
                chaveNormalizada.includes(
                    normalizar(
                        palavras[j]
                    )
                )
            ) {

                return objeto[chave];

            }

        }

    }


    return "";

}


/* =====================================================
   CONVERTER TORNEIOS
===================================================== */

function numeroTorneios(valor) {

    if (
        valor === null ||
        valor === undefined ||
        String(valor).trim() === ""
    ) {

        return null;

    }


    const numero =
        Number(
            String(valor)
                .replace(",", ".")
                .trim()
        );


    if (
        isNaN(numero)
    ) {

        return null;

    }


    return numero;

}


/* =====================================================
   VERIFICAR TORNEIOS
===================================================== */

function classeTorneios(valor) {

    const numero =
        numeroTorneios(valor);


    /*
       0 e 1 = vermelho
       2 ou mais = normal
    */

    if (
        numero !== null &&
        numero < 2
    ) {

        return "torneios-alerta";

    }


    return "";

}


/* =====================================================
   CARREGAR EXCEL
===================================================== */

async function carregarExcel() {

    try {


        const resposta =
            await fetch(
                arquivoExcel +
                "?v=" +
                Date.now()
            );


        if (
            !resposta.ok
        ) {

            throw new Error(
                "Não foi possível encontrar a planilha."
            );

        }


        const dados =
            await resposta.arrayBuffer();


        const workbook =
            XLSX.read(
                dados,
                {
                    type: "array"
                }
            );


        console.log(
            "Abas encontradas:",
            workbook.SheetNames
        );


        /* =================================================
           PROCURAR LISTA AABB
        ================================================= */

        if (
            !workbook.SheetNames.includes(
                "Lista AABB"
            )
        ) {

            throw new Error(
                "A aba Lista AABB não foi encontrada."
            );

        }


        const sheet =
            workbook.Sheets[
                "Lista AABB"
            ];


        const dadosLista =
            XLSX.utils.sheet_to_json(
                sheet,
                {
                    defval: ""
                }
            );


        console.log(
            "Quantidade de linhas da Lista AABB:",
            dadosLista.length
        );


        /* =================================================
           TRANSFORMAR ATLETAS
        ================================================= */

        todosAtletas =
            dadosLista

                .map(
                    atleta => {


                        /* ===============================
                           CÓDIGO
                        =============================== */

                        const codigo =
                            pegarValor(
                                atleta,
                                [
                                    "Reg. CBT",
                                    "Reg CBT",
                                    "Código",
                                    "Codigo",
                                    "Código CBT"
                                ]
                            );


                        /* ===============================
                           NOME
                        =============================== */

                        const nome =
                            pegarValor(
                                atleta,
                                [
                                    "Nome"
                                ]
                            );


                        /* ===============================
                           CLUBE
                        =============================== */

                        const clube =
                            pegarValor(
                                atleta,
                                [
                                    "Clube"
                                ]
                            );


                        /* ===============================
                           CATEGORIA
                        =============================== */

                        let categoria =
                            pegarValor(
                                atleta,
                                [
                                    "Categoria"
                                ]
                            );


                        /*
                           Se não encontrar uma coluna
                           exatamente chamada Categoria,
                           procura qualquer coluna que
                           contenha categoria.
                        */

                        if (
                            !categoria
                        ) {

                            categoria =
                                localizarColuna(
                                    atleta,
                                    [
                                        "categoria"
                                    ]
                                );

                        }


                        categoria =
                            transformarCategoria(
                                categoria
                            );


                        /* ===============================
                           IDADE
                        =============================== */

                        const idade =
                            pegarValor(
                                atleta,
                                [
                                    "Idade"
                                ]
                            );


                        /* ===============================
                           TORNEIOS
                        =============================== */

                        let torneios =
                            pegarValor(
                                atleta,
                                [
                                    "Torneios Jogados (01/2026)",
                                    "Torneios Jogados",
                                    "Torneios",
                                    "Torneios Jogados 01/2026"
                                ]
                            );


                        if (
                            torneios === ""
                        ) {

                            torneios =
                                localizarColuna(
                                    atleta,
                                    [
                                        "torneios"
                                    ]
                                );

                        }


                        /* ===============================
                           SEXO
                        =============================== */

                        const sexo =
                            pegarValor(
                                atleta,
                                [
                                    "Sexo"
                                ]
                            );


                        return {

                            codigo:
                                codigo,

                            nome:
                                nome,

                            clube:
                                clube,

                            categoria:
                                categoria,

                            idade:
                                idade,

                            torneios:
                                torneios,

                            sexo:
                                sexo

                        };

                    }
                )


                /* =========================================
                   REMOVER LINHAS SEM NOME
                ========================================= */

                .filter(
                    atleta => {

                        return (
                            atleta.nome &&
                            String(
                                atleta.nome
                            ).trim() !== ""
                        );

                    }
                );


        /* =================================================
           REMOVER CABEÇALHOS
        ================================================= */

        todosAtletas =
            todosAtletas.filter(
                atleta => {

                    const nome =
                        normalizar(
                            atleta.nome
                        );


                    return (
                        nome !== "nome" &&
                        nome !== "codigo" &&
                        nome !== "clube" &&
                        nome !== "categoria"
                    );

                }
            );


        /* =================================================
           REMOVER DUPLICADOS
        ================================================= */

        todosAtletas =
            removerDuplicados(
                todosAtletas
            );


        console.log(
            "Atletas carregados:",
            todosAtletas.length
        );


        console.log(
            "Categorias encontradas:",
            [...new Set(
                todosAtletas.map(
                    atleta =>
                        atleta.categoria
                )
            )]
        );


        /* =================================================
           CRIAR FILTRO
        ================================================= */

        criarFiltro();


        /* =================================================
           MOSTRAR TODOS
        ================================================= */

        mostrar();


    }

    catch(erro) {

        console.error(
            erro
        );


        document.getElementById(
            "conteudo"
        ).innerHTML = `

            <div class="erro">

                <strong>
                    Erro ao carregar a planilha.
                </strong>

                <br><br>

                ${escaparHtml(
                    erro.message
                )}

                <br><br>

                Arquivo esperado:

                <strong>
                    ${escaparHtml(
                        arquivoExcel
                    )}
                </strong>

            </div>

        `;

    }

}


/* =====================================================
   REMOVER DUPLICADOS
===================================================== */

function removerDuplicados(
    lista
) {

    const mapa =
        new Map();


    lista.forEach(
        atleta => {


            const codigo =
                String(
                    atleta.codigo || ""
                )
                    .trim()
                    .toLowerCase();


            const nome =
                normalizar(
                    atleta.nome
                );


            /*
               Prioriza código.
               Se não tiver código,
               usa nome.
            */

            const chave =
                codigo ||
                nome;


            if (
                chave &&
                !mapa.has(chave)
            ) {

                mapa.set(
                    chave,
                    atleta
                );

            }

        }
    );


    return Array.from(
        mapa.values()
    );

}


/* =====================================================
   CRIAR FILTRO DE CATEGORIAS
===================================================== */

function criarFiltro() {

    const select =
        document.getElementById(
            "selectCategoria"
        );


    /* =========================================
       LIMPAR FILTRO
    ========================================= */

    select.innerHTML = "";


    /* =========================================
       TODOS
    ========================================= */

    const todos =
        document.createElement(
            "option"
        );


    todos.value =
        "TODOS";


    todos.textContent =
        "Todos os inscritos";


    select.appendChild(
        todos
    );


    /* =========================================
       PEGAR CATEGORIAS DOS ATLETAS
    ========================================= */

    const categorias =
        [
            ...new Set(

                todosAtletas

                    .map(
                        atleta =>
                            atleta.categoria
                    )

                    .filter(
                        categoria =>
                            categoria &&
                            categoria.trim() !== ""
                    )

            )
        ];


    /* =========================================
       ORDENAR
    ========================================= */

    categorias.sort(
        (a, b) => {

            return a.localeCompare(
                b,
                "pt-BR",
                {
                    numeric: true
                }
            );

        }
    );


    /* =========================================
       CRIAR OPÇÕES
    ========================================= */

    categorias.forEach(
        categoria => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                categoria;


            option.textContent =
                categoria;


            select.appendChild(
                option
            );

        }
    );


    console.log(
        "Filtro criado:",
        categorias
    );

}


/* =====================================================
   MOSTRAR TODOS
===================================================== */

function mostrarTodos() {

    categoriaAtual =
        "TODOS";


    document.getElementById(
        "selectCategoria"
    ).value =
        "TODOS";


    document.getElementById(
        "botaoTodos"
    ).classList.add(
        "ativo"
    );


    mostrar();

}


/* =====================================================
   SELECIONAR CATEGORIA
===================================================== */

function selecionarCategoria() {

    categoriaAtual =
        document.getElementById(
            "selectCategoria"
        ).value;


    const botao =
        document.getElementById(
            "botaoTodos"
        );


    if (
        categoriaAtual ===
        "TODOS"
    ) {

        botao.classList.add(
            "ativo"
        );

    }
    else {

        botao.classList.remove(
            "ativo"
        );

    }


    mostrar();

}


/* =====================================================
   MOSTRAR
===================================================== */

function mostrar() {

    const campoBusca =
        document.getElementById(
            "busca"
        );


    const busca =
        normalizar(
            campoBusca.value
        );


    let lista =
        [...todosAtletas];


    /* =========================================
       FILTRO POR CATEGORIA
    ========================================= */

    if (
        categoriaAtual !==
        "TODOS"
    ) {

        lista =
            lista.filter(
                atleta => {

                    return (
                        normalizar(
                            atleta.categoria
                        ) ===
                        normalizar(
                            categoriaAtual
                        )
                    );

                }
            );

    }


    /* =========================================
       FILTRO DE PESQUISA
    ========================================= */

    if (
        busca
    ) {

        lista =
            lista.filter(
                atleta => {

                    const texto =
                        normalizar(
                            [
                                atleta.codigo,
                                atleta.nome,
                                atleta.clube,
                                atleta.categoria,
                                atleta.idade,
                                atleta.torneios
                            ].join(" ")
                        );


                    return texto.includes(
                        busca
                    );

                }
            );

    }


    /* =========================================
       TÍTULO
    ========================================= */

    const titulo =
        document.getElementById(
            "titulo"
        );


    if (
        categoriaAtual ===
        "TODOS"
    ) {

        titulo.textContent =
            "Atletas inscritos";

    }
    else {

        titulo.textContent =
            "Inscritos - " +
            categoriaAtual;

    }


    /* =========================================
       CONTADOR
    ========================================= */

    document.getElementById(
        "contador"
    ).textContent =
        lista.length;


    /* =========================================
       RENDERIZAR
    ========================================= */

    renderizarTabela(
        lista
    );

}


/* =====================================================
   RENDERIZAR TABELA
===================================================== */

function renderizarTabela(
    lista
) {

    const conteudo =
        document.getElementById(
            "conteudo"
        );


    if (
        lista.length === 0
    ) {

        conteudo.innerHTML = `

            <div class="vazio">

                Nenhum atleta encontrado.

            </div>

        `;

        return;

    }


    let html = `

        <div class="categoria">

            <div class="categoria-titulo">

                ${
                    categoriaAtual === "TODOS"
                        ? "Atletas inscritos"
                        : "Inscritos - " +
                          escaparHtml(
                              categoriaAtual
                          )
                }

            </div>


            <table>

                <thead>

                    <tr>

                        <th>
                            Código
                        </th>

                        <th>
                            Nome
                        </th>

                        <th>
                            Clube
                        </th>

                        <th>
                            Categoria
                        </th>

                        <th>
                            Idade
                        </th>

                        <th>
                            Torneios
                        </th>

                        <th>
                            Status
                        </th>

                    </tr>

                </thead>


                <tbody>

    `;


    lista.forEach(
        atleta => {


            const classe =
                classeTorneios(
                    atleta.torneios
                );


            html += `

                <tr>

                    <td>
                        ${escaparHtml(
                            atleta.codigo
                        )}
                    </td>


                    <td>

                        <strong>

                            ${escaparHtml(
                                atleta.nome
                            )}

                        </strong>

                    </td>


                    <td>
                        ${escaparHtml(
                            atleta.clube
                        )}
                    </td>


                    <td>
                        ${escaparHtml(
                            atleta.categoria
                        )}
                    </td>


                    <td>
                        ${escaparHtml(
                            atleta.idade
                        )}
                    </td>


                    <td
                        class="${classe}"
                    >

                        ${escaparHtml(
                            atleta.torneios
                        )}

                    </td>


                    <td class="status">

                        ${escaparHtml(
                            atleta.confirmacao || ""
                        )}

                    </td>

                </tr>

            `;

        }
    );


    html += `

                </tbody>

            </table>

        </div>

    `;


    conteudo.innerHTML =
        html;

}


/* =====================================================
   PESQUISA
===================================================== */

document
    .getElementById(
        "busca"
    )
    .addEventListener(
        "input",
        function() {

            mostrar();

        }
    );


/* =====================================================
   INICIAR
===================================================== */

carregarExcel();

</script>

</body>

</html>
