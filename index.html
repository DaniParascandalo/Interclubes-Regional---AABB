<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Interclubes Regional - AABBM</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f5f7;
    color: #172033;
}


/* =====================================================
   CABEÇALHO
===================================================== */

header {
    background: #111827;
    color: white;
    padding: 35px 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    margin: 8px 0 0;
    font-size: 18px;
    opacity: .85;
}


/* =====================================================
   CONTAINER
===================================================== */

.container {
    max-width: 1400px;
    margin: 28px auto;
    padding: 0 18px;
}


/* =====================================================
   MENU
===================================================== */

.menu {
    background: white;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;

    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}


/* =====================================================
   BOTÃO TODOS
===================================================== */

.botao-todos {

    border: 1px solid #d1d5db;

    background: white;

    color: #172033;

    padding: 12px 18px;

    border-radius: 9px;

    font-weight: bold;

    cursor: pointer;

    font-size: 15px;

    margin-bottom: 22px;
}

.botao-todos:hover {
    background: #eef2f7;
}

.botao-todos.ativo {
    background: #0f766e;
    color: white;
    border-color: #0f766e;
}


/* =====================================================
   CATEGORIA
===================================================== */

.label-categoria {

    display: block;

    font-size: 14px;

    font-weight: bold;

    color: #4b5563;

    margin-bottom: 8px;

    text-transform: uppercase;
}


.select-categoria {

    width: 100%;

    max-width: 560px;

    padding: 13px 15px;

    border: 1px solid #9ca3af;

    border-radius: 9px;

    background: white;

    color: #172033;

    font-size: 16px;

    cursor: pointer;
}

.select-categoria:focus {

    outline: none;

    border-color: #0f766e;

    box-shadow: 0 0 0 2px rgba(15,118,110,.15);
}


/* =====================================================
   RESUMO
===================================================== */

.resumo {

    background: white;

    border-radius: 14px;

    padding: 22px;

    margin-bottom: 20px;

    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.resumo h2 {

    margin: 0 0 8px;

    font-size: 28px;
}

.contador {

    font-size: 30px;

    font-weight: bold;

    color: #0f766e;
}

.busca {

    width: 100%;

    padding: 14px;

    margin-top: 15px;

    border: 1px solid #d1d5db;

    border-radius: 9px;

    font-size: 16px;
}


/* =====================================================
   TABELA
===================================================== */

.categoria {

    background: white;

    border-radius: 14px;

    overflow: hidden;

    margin-bottom: 25px;

    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.categoria-titulo {

    background: #374151;

    color: white;

    padding: 15px 18px;

    font-size: 20px;

    font-weight: bold;
}

table {

    width: 100%;

    border-collapse: collapse;
}

th {

    background: #e5e7eb;

    padding: 12px;

    text-align: left;

    font-size: 14px;
}

td {

    padding: 12px;

    border-top: 1px solid #eeeeee;
}

tr:hover {

    background: #f9fafb;
}


/* =====================================================
   STATUS
===================================================== */

.status {

    color: #047857;

    font-weight: bold;
}


/* =====================================================
   SUBTÍTULO
===================================================== */

.subtitulo {

    padding: 18px;

    background: #eef2f7;

    font-size: 18px;

    font-weight: bold;

    color: #172033;

    border-bottom: 1px solid #ddd;
}


/* =====================================================
   MENSAGENS
===================================================== */

.vazio {

    background: white;

    border-radius: 14px;

    padding: 45px;

    text-align: center;

    color: #555;
}

.carregando {

    background: white;

    border-radius: 14px;

    padding: 45px;

    text-align: center;
}

.erro {

    background: #fee2e2;

    color: #991b1b;

    padding: 20px;

    border-radius: 10px;
}


/* =====================================================
   CELULAR
===================================================== */

@media(max-width:700px) {

    header h1 {
        font-size: 24px;
    }

    .container {
        padding: 0 10px;
    }

    .select-categoria {
        max-width: 100%;
    }

    table {
        font-size: 13px;
    }

    th,
    td {
        padding: 8px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     CABEÇALHO
===================================================== -->

<header>

    <h1>🏆 Interclubes Regional</h1>

    <p>AABBM</p>

</header>


<div class="container">


<!-- =====================================================
     MENU
===================================================== -->

<div class="menu">


    <!-- BOTÃO TODOS OS ATLETAS -->

    <button
        id="botaoTodos"
        class="botao-todos"
        onclick="mostrarTodos()"
    >

        📋 TODOS OS ATLETAS

    </button>


    <!-- CATEGORIA -->

    <label
        class="label-categoria"
        for="selectCategoria"
    >

        CATEGORIA

    </label>


    <select
        id="selectCategoria"
        class="select-categoria"
        onchange="selecionarCategoria()"
    >

        <option value="TODOS_INSCRITOS">

            Todos os inscritos

        </option>

    </select>

</div>


<!-- =====================================================
     RESUMO
===================================================== -->

<div class="resumo">

    <h2 id="titulo">

        Atletas inscritos

    </h2>


    <div
        class="contador"
        id="contador"
    >

        0

    </div>


    <input
        id="busca"
        class="busca"
        placeholder="🔎 Pesquisar atleta..."
    >

</div>


<!-- =====================================================
     CONTEÚDO
===================================================== -->

<div id="conteudo">

    <div class="carregando">

        Carregando planilha...

    </div>

</div>


</div>


<script>


/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const arquivoExcel =
"IC26BT - REGIONAL - AABBM.xlsx";


/*
   MODO:
   INSCRITOS = trabalha com os atletas inscritos
   TODOS     = trabalha com a Lista AABB
*/

let modo =
"INSCRITOS";


let categoriaAtual =
"TODOS_INSCRITOS";


let todosAtletas = [];


let inscritos = [];


let grupos = {};


/* =====================================================
   NORMALIZAR TEXTO
===================================================== */

function normalizar(texto) {

    return String(texto || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

}


/* =====================================================
   VERIFICAR CABEÇALHO
===================================================== */

function ehCabecalho(nome) {

    const n =
        normalizar(nome);

    return (

        n === "nome" ||

        n === "codigo" ||

        n === "clube" ||

        n === "categoria" ||

        n === "idade" ||

        n === "confirmacao" ||

        n === "torneios"

    );

}


/* =====================================================
   CARREGAR EXCEL
===================================================== */

async function carregarExcel() {

    try {


        const resposta =
            await fetch(
                arquivoExcel +
                "?v=" +
                Date.now()
            );


        if (!resposta.ok) {

            throw new Error(
                "Excel não encontrado"
            );

        }


        const dados =
            await resposta.arrayBuffer();


        const workbook =
            XLSX.read(
                dados,
                {
                    type: "array"
                }
            );


        console.log(
            "Abas encontradas:",
            workbook.SheetNames
        );


        /* =================================================
           LISTA AABB
        ================================================= */

        if (
            workbook.SheetNames.includes(
                "Lista AABB"
            )
        ) {


            const sheet =
                workbook.Sheets[
                    "Lista AABB"
                ];


            const dadosLista =
                XLSX.utils.sheet_to_json(
                    sheet,
                    {
                        defval: ""
                    }
                );


            todosAtletas =
                dadosLista

                    .map(
                        atleta => ({

                            codigo:
                                atleta["Reg. CBT"] ||
                                atleta["Código"] ||
                                atleta["Codigo"] ||
                                "",


                            nome:
                                atleta["Nome"] ||
                                "",


                            categoria:
                                atleta["Categoria"] ||
                                "",


                            idade:
                                atleta["Idade"] ||
                                "",


                            torneios:
                                atleta[
                                    "Torneios Jogados (01/2026)"
                                ] ||

                                atleta[
                                    "Torneios"
                                ] ||

                                "",


                            sexo:
                                atleta["Sexo"] ||
                                ""

                        })
                    )


                    .filter(
                        atleta =>

                            atleta.nome &&

                            !ehCabecalho(
                                atleta.nome
                            )

                    );

        }


        /* =================================================
           LER ABA GERAL
        ================================================= */

        if (
            workbook.SheetNames.includes(
                "Geral"
            )
        ) {

            lerCategorias(
                workbook.Sheets[
                    "Geral"
                ]
            );

        }


        /* =================================================
           LER ABA SUBS
        ================================================= */

        if (
            workbook.SheetNames.includes(
                "Subs"
            )
        ) {

            lerCategorias(
                workbook.Sheets[
                    "Subs"
                ]
            );

        }


        /* =================================================
           CRIAR CATEGORIAS
        ================================================= */

        criarListaCategorias();


        /* =================================================
           MOSTRAR INSCRITOS
        ================================================= */

        mostrar();


    }

    catch(erro) {

        console.error(
            erro
        );


        document.getElementById(
            "conteudo"
        ).innerHTML = `

            <div class="erro">

                <strong>
                    Erro ao carregar a planilha.
                </strong>

                <br><br>

                Verifique se o arquivo está no GitHub:

                <br><br>

                <strong>
                    ${arquivoExcel}
                </strong>

            </div>

        `;

    }

}


/* =====================================================
   LER CATEGORIAS DAS ABAS DE INSCRIÇÃO
===================================================== */

function lerCategorias(sheet) {


    const linhas =
        XLSX.utils.sheet_to_json(
            sheet,
            {
                header: 1,
                defval: ""
            }
        );


    let categoria =
        "";


    linhas.forEach(
        linha => {


            const primeiraColuna =
                String(
                    linha[0] ||
                    ""
                ).trim();


            /* =========================================
               IDENTIFICAR CATEGORIA
            ========================================= */

            if (
                primeiraColuna.startsWith(
                    "Categoria "
                )
            ) {


                categoria =
                    primeiraColuna;


                if (
                    !grupos[categoria]
                ) {

                    grupos[categoria] = [];

                }


                return;

            }


            if (!categoria) {

                return;

            }


            /* =========================================
               PRIMEIRO BLOCO
            ========================================= */

            adicionarInscrito(
                linha,
                0,
                categoria
            );


            /* =========================================
               SEGUNDO BLOCO
            ========================================= */

            adicionarInscrito(
                linha,
                7,
                categoria
            );

        }
    );

}


/* =====================================================
   ADICIONAR ATLETA INSCRITO
===================================================== */

function adicionarInscrito(
    linha,
    inicio,
    categoria
) {


    const codigo =
        linha[inicio] ||
        "";


    const nome =
        linha[inicio + 1] ||
        "";


    const clube =
        linha[inicio + 2] ||
        "";


    const categoriaLinha =
        linha[inicio + 3] ||
        "";


    const idade =
        linha[inicio + 4] ||
        "";


    const confirmacao =
        linha[inicio + 5] ||
        "";


    const torneios =
        linha[inicio + 6] ||
        "";


    /* =========================================
       SEM NOME
    ========================================= */

    if (
        !String(nome).trim()
    ) {

        return;

    }


    /* =========================================
       IGNORAR CABEÇALHO
    ========================================= */

    if (
        ehCabecalho(nome)
    ) {

        return;

    }


    /* =========================================
       PROCURAR NA LISTA AABB
    ========================================= */

    const encontrado =
        todosAtletas.find(
            atleta =>

                normalizar(
                    atleta.nome
                ) ===

                normalizar(
                    nome
                )
        );


    /* =========================================
       CRIAR OBJETO
    ========================================= */

    const atleta = {


        codigo:

            codigo ||

            (
                encontrado
                ? encontrado.codigo
                : ""
            ),


        nome:
            nome,


        clube:

            clube ||

            (
                encontrado
                ? "AABBM"
                : ""
            ),


        categoria:

            categoriaLinha ||

            (
                encontrado
                ? encontrado.categoria
                : categoria
            ),


        idade:

            idade ||

            (
                encontrado
                ? encontrado.idade
                : ""
            ),


        confirmacao:
            confirmacao,


        torneios:

            torneios ||

            (
                encontrado
                ? encontrado.torneios
                : ""
            )

    };


    /* =========================================
       EVITAR DUPLICADOS NA LISTA DE INSCRITOS
    ========================================= */

    const jaExiste =
        inscritos.some(
            item =>

                normalizar(
                    item.nome
                ) ===

                normalizar(
                    atleta.nome
                )
        );


    if (!jaExiste) {

        inscritos.push(
            atleta
        );

    }


    /* =========================================
       GRUPO DA CATEGORIA
    ========================================= */

    if (
        !grupos[categoria]
    ) {

        grupos[categoria] = [];

    }


    const existeNoGrupo =
        grupos[categoria].some(
            item =>

                normalizar(
                    item.nome
                ) ===

                normalizar(
                    atleta.nome
                )
        );


    if (!existeNoGrupo) {

        grupos[categoria].push(
            atleta
        );

    }

}


/* =====================================================
   CRIAR LISTA SUSPENSA
===================================================== */

function criarListaCategorias() {


    const select =
        document.getElementById(
            "selectCategoria"
        );


    Object.keys(grupos)
        .forEach(
            categoria => {


                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    categoria;


                option.textContent =
                    categoria;


                select.appendChild(
                    option
                );

            }
        );

}


/* =====================================================
   BOTÃO TODOS OS ATLETAS
===================================================== */

function mostrarTodos() {


    modo =
        "TODOS";


    categoriaAtual =
        "TODAS_CATEGORIAS";


    document
        .getElementById(
            "botaoTodos"
        )
        .classList.add(
            "ativo"
        );


    document.getElementById(
        "selectCategoria"
    ).value = "";


    document.getElementById(
        "busca"
    ).value = "";


    mostrar();

}


/* =====================================================
   SELECIONAR CATEGORIA
===================================================== */

function selecionarCategoria() {


    const select =
        document.getElementById(
            "selectCategoria"
        );


    const valor =
        select.value;


    /*
       SE ESCOLHER
       "TODOS OS INSCRITOS"
    */

    if (
        valor ===
        "TODOS_INSCRITOS"
    ) {


        modo =
            "INSCRITOS";


        categoriaAtual =
            "TODOS_INSCRITOS";


        document
            .getElementById(
                "botaoTodos"
            )
            .classList.remove(
                "ativo"
            );


        document.getElementById(
            "busca"
        ).value = "";


        mostrar();


        return;

    }


    /*
       SE ESTIVER NA LISTA GERAL
       O FILTRO SERÁ NA LISTA AABB
    */

    if (
        modo ===
        "TODOS"
    ) {

        categoriaAtual =
            valor;


    }


    /*
       SE ESTIVER NOS INSCRITOS
       O FILTRO SERÁ NOS INSCRITOS
    */

    else {

        categoriaAtual =
            valor;

    }


    document.getElementById(
        "busca"
    ).value = "";


    mostrar();

}


/* =====================================================
   VERIFICAR CATEGORIA DA LISTA GERAL
===================================================== */

function categoriaEhCompativel(
    categoriaAtleta,
    categoriaSelecionada
) {


    const atleta =
        normalizar(
            categoriaAtleta
        );


    const selecionada =
        normalizar(
            categoriaSelecionada
        );


    /* =========================================
       PROFISSIONAL
    ========================================= */

    if (
        selecionada.includes(
            "profissional"
        )
    ) {

        return atleta.includes(
            "profissional"
        );

    }


    /* =========================================
       A B C D E
    ========================================= */

    if (
        /^categoria [abcde]$/.test(
            selecionada
        )
    ) {


        const letra =
            selecionada.replace(
                "categoria ",
                ""
            );


        return (
            atleta === letra ||
            atleta ===
            "bt" + letra
        );

    }


    /* =========================================
       40+
    ========================================= */

    if (
        selecionada.includes(
            "40+"
        )
    ) {

        return (

            atleta.includes(
                "40"
            )

        );

    }


    /* =========================================
       50+
    ========================================= */

    if (
        selecionada.includes(
            "50+"
        )
    ) {

        return (

            atleta.includes(
                "50"
            )

        );

    }


    /* =========================================
       60+
    ========================================= */

    if (
        selecionada.includes(
            "60+"
        )
    ) {

        return (

            atleta.includes(
                "60"
            )

        );

    }


    /* =========================================
       SUB 10
    ========================================= */

    if (
        selecionada.includes(
            "sub 10"
        )
    ) {

        return atleta.includes(
            "sub 10"
        );

    }


    /* =========================================
       SUB 12
    ========================================= */

    if (
        selecionada.includes(
            "sub 12"
        )
    ) {

        return atleta.includes(
            "sub 12"
        );

    }


    /* =========================================
       SUB 14
    ========================================= */

    if (
        selecionada.includes(
            "sub 14"
        )
    ) {

        return atleta.includes(
            "sub 14"
        );

    }


    /* =========================================
       SUB 16
    ========================================= */

    if (
        selecionada.includes(
            "sub 16"
        )
    ) {

        return atleta.includes(
            "sub 16"
        );

    }


    /* =========================================
       SUB 18
    ========================================= */

    if (
        selecionada.includes(
            "sub 18"
        )
    ) {

        return atleta.includes(
            "sub 18"
        );

    }


    /* =========================================
       COMPARAÇÃO NORMAL
    ========================================= */

    return atleta ===
           selecionada;

}


/* =====================================================
   OBTER LISTA
===================================================== */

function obterLista() {


    /* =================================================
       MODO INSCRITOS
    ================================================= */

    if (
        modo ===
        "INSCRITOS"
    ) {


        /* =============================================
           TODOS OS INSCRITOS
        ============================================= */

        if (
            categoriaAtual ===
            "TODOS_INSCRITOS"
        ) {

            return [
                ...inscritos
            ];

        }


        /* =============================================
           INSCRITOS DE UMA CATEGORIA
        ============================================= */

        return inscritos.filter(
            atleta =>

                categoriaEhCompativel(
                    atleta.categoria,
                    categoriaAtual
                ) ||

                normalizar(
                    atleta.categoria
                ) ===

                normalizar(
                    categoriaAtual
                )

        );

    }


    /* =================================================
       MODO TODOS OS ATLETAS
    ================================================= */

    if (
        modo ===
        "TODOS"
    ) {


        /* =============================================
           TODOS DA LISTA AABB
        ============================================= */

        if (
            categoriaAtual ===
            "TODAS_CATEGORIAS"
        ) {

            return [
                ...todosAtletas
            ];

        }


        /* =============================================
           FILTRAR LISTA AABB POR CATEGORIA
        ============================================= */

        return todosAtletas.filter(
            atleta =>

                categoriaEhCompativel(
                    atleta.categoria,
                    categoriaAtual
                )

        );

    }


    return [];

}


/* =====================================================
   BUSCAR STATUS DO ATLETA
===================================================== */

function buscarInscrito(
    nome
) {


    return inscritos.find(
        atleta =>

            normalizar(
                atleta.nome
            ) ===

            normalizar(
                nome
            )
    );

}


/* =====================================================
   MOSTRAR
===================================================== */

function mostrar() {


    let lista =
        obterLista();


    /* =================================================
       PESQUISA
    ================================================= */

    const busca =
        normalizar(
            document.getElementById(
                "busca"
            ).value
        );


    if (busca) {


        lista =
            lista.filter(
                atleta =>

                    normalizar(
                        atleta.nome
                    ).includes(
                        busca
                    )

            );

    }


    /* =================================================
       ORDENAR
    ================================================= */

    lista.sort(
        (a,b) =>

            String(
                a.nome
            ).localeCompare(
                String(
                    b.nome
                ),
                "pt-BR"
            )
    );


    /* =================================================
       CONTADOR
    ================================================= */

    document.getElementById(
        "contador"
    ).innerText =
        lista.length;


    /* =================================================
       TÍTULO
    ================================================= */

    if (
        modo ===
        "INSCRITOS"
    ) {


        if (
            categoriaAtual ===
            "TODOS_INSCRITOS"
        ) {

            document.getElementById(
                "titulo"
            ).innerText =
                "Atletas inscritos";

        }

        else {

            document.getElementById(
                "titulo"
            ).innerText =
                "Inscritos - " +
                categoriaAtual;

        }

    }

    else {


        if (
            categoriaAtual ===
            "TODAS_CATEGORIAS"
        ) {

            document.getElementById(
                "titulo"
            ).innerText =
                "Todos os atletas";

        }

        else {

            document.getElementById(
                "titulo"
            ).innerText =
                "Todos os atletas - " +
                categoriaAtual;

        }

    }


    /* =================================================
       NENHUM RESULTADO
    ================================================= */

    if (
        !lista.length
    ) {


        document.getElementById(
            "conteudo"
        ).innerHTML = `

            <div class="vazio">

                Nenhum atleta encontrado.

            </div>

        `;


        return;

    }


    /* =================================================
       TABELA
    ================================================= */

    let html = `

        <div class="categoria">

            <div class="categoria-titulo">

                ${
                    modo === "INSCRITOS"

                    ?

                    (
                        categoriaAtual ===
                        "TODOS_INSCRITOS"

                        ?

                        "Atletas inscritos"

                        :

                        "Inscritos - " +
                        categoriaAtual
                    )

                    :

                    (
                        categoriaAtual ===
                        "TODAS_CATEGORIAS"

                        ?

                        "Todos os atletas"

                        :

                        "Todos os atletas - " +
                        categoriaAtual
                    )
                }

            </div>


            <table>

                <thead>

                    <tr>

                        <th>
                            Código
                        </th>

                        <th>
                            Nome
                        </th>

                        <th>
                            Clube
                        </th>

                        <th>
                            Categoria
                        </th>

                        <th>
                            Idade
                        </th>

                        <th>
                            Torneios
                        </th>

                        <th>
                            Status
                        </th>

                    </tr>

                </thead>


                <tbody>

    `;


    /* =================================================
       LINHAS
    ================================================= */

    lista.forEach(
        atleta => {


            /*
               PROCURAR SE ELE ESTÁ INSCRITO
            */

            const inscrito =
                buscarInscrito(
                    atleta.nome
                );


            /*
               CONFIRMADO SOMENTE COM OK
            */

            const confirmado =

                inscrito &&

                normalizar(
                    inscrito.confirmacao
                ) ===
                "ok";


            /*
               SE ESTAMOS EM INSCRITOS,
               USA O PRÓPRIO STATUS

               SE ESTAMOS EM TODOS,
               MOSTRA O STATUS CASO
               ELE TAMBÉM ESTEJA INSCRITO
            */

            let statusHTML =
                "";


            if (
                confirmado
            ) {

                statusHTML = `

                    <span class="status">

                        ● Confirmado

                    </span>

                `;

            }


            html += `

                <tr>


                    <td>

                        ${
                            atleta.codigo ||
                            ""
                        }

                    </td>


                    <td>

                        <strong>

                            ${
                                atleta.nome ||
                                ""
                            }

                        </strong>

                    </td>


                    <td>

                        ${
                            atleta.clube ||
                            "AABBM"
                        }

                    </td>


                    <td>

                        ${
                            atleta.categoria ||
                            ""
                        }

                    </td>


                    <td>

                        ${
                            atleta.idade ||
                            ""
                        }

                    </td>


                    <td>

                        ${
                            atleta.torneios ||
                            ""
                        }

                    </td>


                    <td>

                        ${statusHTML}

                    </td>


                </tr>

            `;

        }
    );


    html += `

                </tbody>

            </table>

        </div>

    `;


    document.getElementById(
        "conteudo"
    ).innerHTML =
        html;

}


/* =====================================================
   PESQUISA
===================================================== */

document
    .getElementById(
        "busca"
    )
    .addEventListener(
        "input",
        mostrar
    );


/* =====================================================
   INICIAR
===================================================== */

carregarExcel();

</script>

</body>

</html>
