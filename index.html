<body>


<header>

    <p>AABBM</p>

<div class="container">

     FILTRO
===================================================== -->

<div class="menu">

<div class="resumo">

    </div>

        id="busca"

    >

</div>


<!-- =====================================================
     RESULTADO
===================================================== -->

<div id="conteudo">

    <div class="carregando">

        Carregando planilha...

    </div>

</div>


</div>


<script>


/* =====================================================
   ARQUIVO EXCEL
===================================================== */

const arquivoExcel =
    "IC26BT - REGIONAL - AABBM.xlsx";


/* =====================================================
   VARIÁVEIS
===================================================== */

let atletas = [];

let categorias = [];

let categoriaAtual = "";


/* =====================================================
   NORMALIZAR TEXTO
===================================================== */

function normalizar(texto) {

    return String(texto || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        );

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHtml(valor) {

    return String(valor ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   CONVERTER TORNEIOS
===================================================== */

function numeroTorneios(valor) {

    if (
        valor === null ||
        valor === undefined ||
        String(valor).trim() === ""
    ) {

        return null;

    }


    const numero =
        Number(
            String(valor)
                .replace(",", ".")
                .trim()
        );


    if (
        isNaN(numero)
    ) {

        return null;

    }


    return numero;

}


/* =====================================================
   TORNEIOS VERMELHO
===================================================== */

function classeTorneios(valor) {

    const numero =
        numeroTorneios(valor);


    /*
       0 ou 1 = vermelho
       2 ou mais = normal
    */

    if (
        numero !== null &&
        numero < 2
    ) {

        return "torneios-alerta";

    }


    return "";

}


/* =====================================================
   VERIFICAR LINHA DE CABEÇALHO
===================================================== */

function ehCabecalho(
    linha,
    colunaInicial
) {

    const codigo =
        normalizar(
            linha[colunaInicial]
        );


    const nome =
        normalizar(
            linha[colunaInicial + 1]
        );


    return (
        codigo === "codigo" ||
        nome === "nome"
    );

}


/* =====================================================
   VERIFICAR SE É UMA LINHA DE CATEGORIA
===================================================== */

function ehCategoria(
    valor
) {

    if (
        valor === null ||
        valor === undefined
    ) {

        return false;

    }


    const texto =
        String(valor).trim();


    if (
        !texto
    ) {

        return false;

    }


    /*
       Procuramos exatamente os títulos
       dos blocos que existem na planilha.

       Exemplos:

       A Feminino
       A Masculino
       B Feminino
       B Masculino
       40+ Feminino
       etc.
    */

    const nomesConhecidos = [

        "Profissional Feminino",
        "Profissional Masculino",

        "A Feminino",
        "A Masculino",

        "B Feminino",
        "B Masculino",

        "C Feminino",
        "C Masculino",

        "D Feminino",
        "D Masculino",

        "E Feminino",
        "E Masculino",

        "40+ Feminino",
        "40+ Masculino",

        "50+ Feminino",
        "50+ Masculino",

        "60+ Feminino",
        "60+ Masculino",

        "Categoria Sub 10 - Mista",

        "Sub12 Feminino",
        "Sub12 Masculino",

        "Sub14 Feminino",
        "Sub14 Masculino",

        "Sub16 Feminino",
        "Sub16 Masculino",

        "Sub18 Feminino",
        "Sub18 Masculino"

    ];


    return nomesConhecidos.some(
        nome =>
            normalizar(nome) ===
            normalizar(texto)
    );

}


/* =====================================================
   PEGAR NOME DA CATEGORIA
===================================================== */

function nomeCategoria(
    valor
) {

    if (
        valor === null ||
        valor === undefined
    ) {

        return "";

    }


    const texto =
        String(valor).trim();


    const nomesConhecidos = [

        "Profissional Feminino",
        "Profissional Masculino",

        "A Feminino",
        "A Masculino",

        "B Feminino",
        "B Masculino",

        "C Feminino",
        "C Masculino",

        "D Feminino",
        "D Masculino",

        "E Feminino",
        "E Masculino",

        "40+ Feminino",
        "40+ Masculino",

        "50+ Feminino",
        "50+ Masculino",

        "60+ Feminino",
        "60+ Masculino",

        "Categoria Sub 10 - Mista",

        "Sub12 Feminino",
        "Sub12 Masculino",

        "Sub14 Feminino",
        "Sub14 Masculino",

        "Sub16 Feminino",
        "Sub16 Masculino",

        "Sub18 Feminino",
        "Sub18 Masculino"

    ];


    const encontrada =
        nomesConhecidos.find(
            nome =>
                normalizar(nome) ===
                normalizar(texto)
        );


    return encontrada || "";

}


/* =====================================================
   ADICIONAR ATLETA
===================================================== */

function adicionarAtleta(
    linha,
    colunaInicial,
    categoria
) {

    /*
       Não adicionar cabeçalho
    */

    if (
        ehCabecalho(
            linha,
            colunaInicial
        )
    ) {

        return;

    }


    const codigo =
        linha[colunaInicial] || "";


    const nome =
        linha[colunaInicial + 1] || "";


    const clube =
        linha[colunaInicial + 2] || "";


    const categoriaDaPlanilha =
        linha[colunaInicial + 3] || "";


    const idade =
        linha[colunaInicial + 4] || "";


    const confirmacao =
        linha[colunaInicial + 5] || "";


    const torneios =
        linha[colunaInicial + 6] || "";


    /*
       Não adicionar linha sem nome
    */

    if (
        !nome ||
        String(nome).trim() === ""
    ) {

        return;

    }


    /*
       Não adicionar texto de cabeçalho
    */

    const nomeNormalizado =
        normalizar(nome);


    if (
        nomeNormalizado === "nome" ||
        nomeNormalizado === "codigo" ||
        nomeNormalizado === "clube" ||
        nomeNormalizado === "categoria" ||
        nomeNormalizado === "idade" ||
        nomeNormalizado === "confirmacao" ||
        nomeNormalizado === "torneios"
    ) {

        return;

    }


    /*
       Adicionar atleta
    */

    atletas.push({

        codigo:
            codigo,

        nome:
            nome,

        clube:
            clube,

        categoria:
            categoria,

        categoriaPlanilha:
            categoriaDaPlanilha,

        idade:
            idade,

        confirmacao:
            confirmacao,

        torneios:
            torneios

    });

}


/* =====================================================
   LER ABA GERAL
===================================================== */

function lerGeral(
    sheet
) {

    const linhas =
        XLSX.utils.sheet_to_json(
            sheet,
            {
                header: 1,
                defval: ""
            }
        );


    /*
       A planilha possui:

       Feminino = A:G
       Masculino = H:N

       Cada bloco começa com o nome
       da categoria.

       Exemplo:

       A Feminino       | A Masculino
       Código...        | Código...
       atletas...       | atletas...

       depois:

       B Feminino       | B Masculino
    */


    let categoriaFeminino =
        "";

    let categoriaMasculino =
        "";


    for (
        let r = 0;
        r < linhas.length;
        r++
    ) {

        const linha =
            linhas[r];


        /* ---------------------------------------------
           VERIFICAR TÍTULO FEMININO
        --------------------------------------------- */

        const tituloF =
            nomeCategoria(
                linha[0]
            );


        if (
            tituloF
        ) {

            categoriaFeminino =
                tituloF;

        }


        /* ---------------------------------------------
           VERIFICAR TÍTULO MASCULINO
        --------------------------------------------- */

        const tituloM =
            nomeCategoria(
                linha[7]
            );


        if (
            tituloM
        ) {

            categoriaMasculino =
                tituloM;

        }


        /* ---------------------------------------------
           ADICIONAR FEMININO
        --------------------------------------------- */

        if (
            categoriaFeminino
        ) {

            adicionarAtleta(
                linha,
                0,
                categoriaFeminino
            );

        }


        /* ---------------------------------------------
           ADICIONAR MASCULINO
        --------------------------------------------- */

        if (
            categoriaMasculino
        ) {

            adicionarAtleta(
                linha,
                7,
                categoriaMasculino
            );

        }

    }

}


/* =====================================================
   LER ABA SUBS
===================================================== */

function lerSubs(
    sheet
) {

    const linhas =
        XLSX.utils.sheet_to_json(
            sheet,
            {
                header: 1,
                defval: ""
            }
        );


    /*
       Mesma estrutura:

       A:G = lado esquerdo
       H:N = lado direito
    */


    let categoriaFeminino =
        "";

    let categoriaMasculino =
        "";


    for (
        let r = 0;
        r < linhas.length;
        r++
    ) {

        const linha =
            linhas[r];


        /* ---------------------------------------------
           FEMININO / MISTA
        --------------------------------------------- */

        const tituloF =
            nomeCategoria(
                linha[0]
            );


        if (
            tituloF
        ) {

            categoriaFeminino =
                tituloF;

        }


        /* ---------------------------------------------
           MASCULINO
        --------------------------------------------- */

        const tituloM =
            nomeCategoria(
                linha[7]
            );


        if (
            tituloM
        ) {

            categoriaMasculino =
                tituloM;

        }


        /* ---------------------------------------------
           ADICIONAR FEMININO
        --------------------------------------------- */

        if (
            categoriaFeminino
        ) {

            adicionarAtleta(
                linha,
                0,
                categoriaFeminino
            );

        }


        /* ---------------------------------------------
           ADICIONAR MASCULINO
        --------------------------------------------- */

        if (
            categoriaMasculino
        ) {

            adicionarAtleta(
                linha,
                7,
                categoriaMasculino
            );

        }

    }

}


/* =====================================================
   REMOVER DUPLICADOS
===================================================== */

function removerDuplicados(
    lista
) {

    const mapa =
        new Map();


    lista.forEach(
        atleta => {

            /*
               A categoria faz parte da chave.

               Assim, o mesmo código pode existir
               em categorias diferentes sem que
               uma categoria apague a outra.
            */

            const chave =
                normalizar(
                    atleta.categoria
                ) +
                "|" +
                String(
                    atleta.codigo || ""
                ).trim() +
                "|" +
                normalizar(
                    atleta.nome
                );


            if (
                !mapa.has(chave)
            ) {

                mapa.set(
                    chave,
                    atleta
                );

            }

        }
    );


    return Array.from(
        mapa.values()
    );

}


/* =====================================================
   CRIAR FILTRO
===================================================== */

function criarFiltro() {

    const select =
        document.getElementById(
            "selectCategoria"
        );


    select.innerHTML = "";


    /*
       PRIMEIRA OPÇÃO
    */

    const primeira =
        document.createElement(
            "option"
        );


    primeira.value =
        "";


    primeira.textContent =
        "Selecione uma categoria";


    select.appendChild(
        primeira
    );


    /*
       Pegar todas as categorias
       que realmente foram encontradas
    */

    categorias =
        [
            ...new Set(
                atletas
                    .map(
                        atleta =>
                            atleta.categoria
                    )
                    .filter(
                        categoria =>
                            categoria
                    )
            )
        ];


    /*
       Ordem desejada
    */

    const ordem = [

        "Profissional Feminino",
        "Profissional Masculino",

        "A Feminino",
        "A Masculino",

        "B Feminino",
        "B Masculino",

        "C Feminino",
        "C Masculino",

        "D Feminino",
        "D Masculino",

        "E Feminino",
        "E Masculino",

        "40+ Feminino",
        "40+ Masculino",

        "50+ Feminino",
        "50+ Masculino",

        "60+ Feminino",
        "60+ Masculino",

        "Categoria Sub 10 - Mista",

        "Sub12 Feminino",
        "Sub12 Masculino",

        "Sub14 Feminino",
        "Sub14 Masculino",

        "Sub16 Feminino",
        "Sub16 Masculino",

        "Sub18 Feminino",
        "Sub18 Masculino"

    ];


    categorias.sort(
        (a, b) => {

            const posA =
                ordem.indexOf(a);


            const posB =
                ordem.indexOf(b);


            if (
                posA === -1 &&
                posB === -1
            ) {

                return a.localeCompare(
                    b,
                    "pt-BR"
                );

            }


            if (
                posA === -1
            ) {

                return 1;

            }


            if (
                posB === -1
            ) {

                return -1;

            }


            return posA - posB;

        }
    );


    /*
       Criar opções
    */

    categorias.forEach(
        categoria => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                categoria;


            option.textContent =
                categoria;


            select.appendChild(
                option
            );

        }
    );


    console.log(
        "CATEGORIAS ENCONTRADAS:",
        categorias
    );

}


/* =====================================================
   SELECIONAR CATEGORIA
===================================================== */

function selecionarCategoria() {

    categoriaAtual =
        document.getElementById(
            "selectCategoria"
        ).value;


    mostrarCategoria();

}


/* =====================================================
   MOSTRAR CATEGORIA
===================================================== */

function mostrarCategoria() {

    const busca =
        normalizar(
            document.getElementById(
                "busca"
            ).value
        );


    /*
       Nenhuma categoria selecionada
    */

    if (
        !categoriaAtual
    ) {

        document.getElementById(
            "titulo"
        ).textContent =
            "Selecione uma categoria";


        document.getElementById(
            "contador"
        ).textContent =
            "0";


        document.getElementById(
            "conteudo"
        ).innerHTML = `

            <div class="vazio">

                Selecione uma categoria acima.

            </div>

        `;


        return;

    }


    /*
       Filtrar EXATAMENTE a categoria
    */

    let lista =
        atletas.filter(
            atleta =>
                normalizar(
                    atleta.categoria
                ) ===
                normalizar(
                    categoriaAtual
                )
        );


    /*
       Pesquisa
    */

    if (
        busca
    ) {

        lista =
            lista.filter(
                atleta => {

                    const texto =
                        normalizar(
                            [
                                atleta.codigo,
                                atleta.nome,
                                atleta.clube,
                                atleta.categoria,
                                atleta.categoriaPlanilha,
                                atleta.idade,
                                atleta.torneios
                            ].join(" ")
                        );


                    return texto.includes(
                        busca
                    );

                }
            );

    }


    /*
       Título
    */

    document.getElementById(
        "titulo"
    ).textContent =
        "Inscritos - " +
        categoriaAtual;


    /*
       Quantidade
    */

    document.getElementById(
        "contador"
    ).textContent =
        lista.length;


    /*
       Tabela
    */

    renderizarTabela(
        lista
    );

}


/* =====================================================
   RENDERIZAR TABELA
===================================================== */

function renderizarTabela(
    lista
) {

    const conteudo =
        document.getElementById(
            "conteudo"
        );


    /*
       Nenhum atleta
    */

    if (
        lista.length === 0
    ) {

        conteudo.innerHTML = `

            <div class="vazio">

                Nenhum atleta encontrado
                nesta categoria.

            </div>

        `;


        return;

    }


    let html = `

        <div class="categoria">

            <div class="categoria-titulo">

                Inscritos -
                ${escaparHtml(
                    categoriaAtual
                )}

            </div>


            <table>

                <thead>

                    <tr>

                        <th>
                            Código
                        </th>

                        <th>
                            Nome
                        </th>

                        <th>
                            Clube
                        </th>

                        <th>
                            Categoria
                        </th>

                        <th>
                            Idade
                        </th>

                        <th>
                            Torneios
                        </th>

                        <th>
                            Status
                        </th>

                    </tr>

                </thead>


                <tbody>

    `;


    /*
       Adicionar cada atleta
    */

    lista.forEach(
        atleta => {

            const classe =
                classeTorneios(
                    atleta.torneios
                );


            html += `

                <tr>

                    <td>
                        ${escaparHtml(
                            atleta.codigo
                        )}
                    </td>


                    <td>

                        <strong>

                            ${escaparHtml(
                                atleta.nome
                            )}

                        </strong>

                    </td>


                    <td>
                        ${escaparHtml(
                            atleta.clube
                        )}
                    </td>


                    <td>
                        ${escaparHtml(
                            atleta.categoriaPlanilha
                        )}
                    </td>


                    <td>
                        ${escaparHtml(
                            atleta.idade
                        )}
                    </td>


                    <td
                        class="${classe}"
                    >

                        ${escaparHtml(
                            atleta.torneios
                        )}

                    </td>


                    <td>

                        ${escaparHtml(
                            atleta.confirmacao
                        )}

                    </td>

                </tr>

            `;

        }
    );


    html += `

                </tbody>

            </table>

        </div>

    `;


    conteudo.innerHTML =
        html;

}


/* =====================================================
   PESQUISA
===================================================== */

document
    .getElementById(
        "busca"
    )
    .addEventListener(
        "input",
        function() {

            mostrarCategoria();

        }
    );


/* =====================================================
   CARREGAR PLANILHA
===================================================== */

async function iniciar() {

    try {

        /*
           Buscar Excel
        */

        const resposta =
            await fetch(
                arquivoExcel +
                "?v=" +
                Date.now()
            );


        if (
            !resposta.ok
        ) {

            throw new Error(
                "Não foi possível carregar a planilha."
            );

        }


        /*
           Converter para ArrayBuffer
        */

        const dados =
            await resposta.arrayBuffer();


        /*
           Abrir Excel
        */

        const workbook =
            XLSX.read(
                dados,
                {
                    type: "array"
                }
            );


        console.log(
            "ABAS ENCONTRADAS:",
            workbook.SheetNames
        );


        /*
           Limpar dados
        */

        atletas = [];


        /*
           =================================================
           LER SOMENTE GERAL
           =================================================
        */

        if (
            workbook.SheetNames.includes(
                "Geral"
            )
        ) {

            lerGeral(
                workbook.Sheets[
                    "Geral"
                ]
            );

        }
        else {

            throw new Error(
                "A aba Geral não foi encontrada."
            );

        }


        /*
           =================================================
           LER SOMENTE SUBS
           =================================================
        */

        if (
            workbook.SheetNames.includes(
                "Subs"
            )
        ) {

            lerSubs(
                workbook.Sheets[
                    "Subs"
                ]
            );

        }
        else {

            throw new Error(
                "A aba Subs não foi encontrada."
            );

        }


        /*
           Remover duplicados
        */

        atletas =
            removerDuplicados(
                atletas
            );


        /*
           Criar filtro
        */

        criarFiltro();


        /*
           Mostrar estado inicial
        */

        document.getElementById(
            "titulo"
        ).textContent =
            "Selecione uma categoria";


        document.getElementById(
            "contador"
        ).textContent =
            "0";


        document.getElementById(
            "conteudo"
        ).innerHTML = `

            <div class="vazio">

                Selecione uma categoria acima.

            </div>

        `;


        /*
           LOGS PARA CONFERIR
        */

        console.log(
            "TOTAL DE ATLETAS CARREGADOS:",
            atletas.length
        );


        console.log(
            "CATEGORIAS:",
            categorias
        );


    }
    catch (
        erro
    ) {

        console.error(
            erro
        );


        document.getElementById(
            "conteudo"
        ).innerHTML = `

            <div class="erro">

                <strong>
                    Erro ao carregar os dados.
                </strong>

                <br><br>

                ${escaparHtml(
                    erro.message
                )}

            </div>

        `;

    }

}


/* =====================================================
   INICIAR SITE
===================================================== */

iniciar();

</script>
