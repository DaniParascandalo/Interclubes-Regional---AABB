<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Interclubes Regional - AABBM</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f5f7;
    color: #172033;
}


/* =====================================================
   CABEÇALHO
===================================================== */

header {
    background: #111827;
    color: white;
    padding: 35px 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    margin: 8px 0 0;
    font-size: 18px;
    opacity: .85;
}


/* =====================================================
   CONTAINER
===================================================== */

.container {
    max-width: 1400px;
    margin: 28px auto;
    padding: 0 18px;
}


/* =====================================================
   FILTRO
===================================================== */

.menu {
    background: white;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.label-categoria {
    display: block;
    font-size: 14px;
    font-weight: bold;
    color: #4b5563;
    margin-bottom: 8px;
    text-transform: uppercase;
}

.select-categoria {
    width: 100%;
    max-width: 560px;
    padding: 13px 15px;
    border: 1px solid #9ca3af;
    border-radius: 9px;
    background: white;
    color: #172033;
    font-size: 16px;
    cursor: pointer;
}

.select-categoria:focus {
    outline: none;
    border-color: #0f766e;
    box-shadow: 0 0 0 2px rgba(15,118,110,.15);
}


/* =====================================================
   RESUMO
===================================================== */

.resumo {
    background: white;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.resumo h2 {
    margin: 0 0 8px;
    font-size: 28px;
}

.contador {
    font-size: 30px;
    font-weight: bold;
    color: #0f766e;
}

.busca {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    font-size: 16px;
}

.busca:focus {
    outline: none;
    border-color: #0f766e;
}


/* =====================================================
   TABELA
===================================================== */

.categoria {
    background: white;
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 25px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.categoria-titulo {
    background: #374151;
    color: white;
    padding: 15px 18px;
    font-size: 20px;
    font-weight: bold;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #e5e7eb;
    padding: 12px;
    text-align: left;
    font-size: 14px;
}

td {
    padding: 12px;
    border-top: 1px solid #eeeeee;
}

tr:hover {
    background: #f9fafb;
}


/* =====================================================
   TORNEIOS VERMELHO
===================================================== */

.torneios-alerta {
    color: red !important;
    font-weight: bold;
}


/* =====================================================
   MENSAGENS
===================================================== */

.vazio {
    background: white;
    border-radius: 14px;
    padding: 45px;
    text-align: center;
    color: #555;
}

.carregando {
    background: white;
    border-radius: 14px;
    padding: 45px;
    text-align: center;
}

.erro {
    background: #fee2e2;
    color: #991b1b;
    padding: 20px;
    border-radius: 10px;
}


/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width:700px) {

    header h1 {
        font-size: 24px;
    }

    .container {
        padding: 0 10px;
    }

    .select-categoria {
        max-width: 100%;
    }

    table {
        font-size: 13px;
    }

    th,
    td {
        padding: 8px;
    }

}

</style>

</head>


<body>


<header>

    <h1>🏆 Interclubes Regional</h1>

    <p>AABBM</p>

</header>


<div class="container">


<!-- =====================================================
     FILTRO
===================================================== -->

<div class="menu">

    <label
        class="label-categoria"
        for="selectCategoria"
    >
        CATEGORIA
    </label>


    <select
        id="selectCategoria"
        class="select-categoria"
        onchange="selecionarCategoria()"
    >

        <option value="">
            Selecione uma categoria
        </option>

    </select>

</div>


<!-- =====================================================
     RESUMO
===================================================== -->

<div class="resumo">

    <h2 id="titulo">
        Selecione uma categoria
    </h2>


    <div
        class="contador"
        id="contador"
    >
        0
    </div>


    <input
        id="busca"
        class="busca"
        type="text"
        placeholder="🔎 Pesquisar atleta..."
    >

</div>


<!-- =====================================================
     RESULTADO
===================================================== -->

<div id="conteudo">

    <div class="carregando">
        Carregando planilha...
    </div>

</div>


</div>


<script>


/* =====================================================
   ARQUIVO EXCEL
===================================================== */

const arquivoExcel =
    "IC26BT - REGIONAL - AABBM.xlsx";


/* =====================================================
   VARIÁVEIS
===================================================== */

let atletas = [];

let categorias = [];

let categoriaAtual = "";


/* =====================================================
   ORDEM DAS CATEGORIAS
===================================================== */

const ordemCategorias = [

    "Profissional Feminino",
    "Profissional Masculino",

    "A Feminino",
    "A Masculino",

    "B Feminino",
    "B Masculino",

    "C Feminino",
    "C Masculino",

    "D Feminino",
    "D Masculino",

    "E Feminino",
    "E Masculino",

    "40+ Feminino",
    "40+ Masculino",

    "50+ Feminino",
    "50+ Masculino",

    "60+ Feminino",
    "60+ Masculino",

    "Categoria Sub 10 - Mista",

    "Sub12 Feminino",
    "Sub12 Masculino",

    "Sub14 Feminino",
    "Sub14 Masculino",

    "Sub16 Feminino",
    "Sub16 Masculino",

    "Sub18 Feminino",
    "Sub18 Masculino"

];


/* =====================================================
   NORMALIZAR TEXTO
===================================================== */

function normalizar(texto) {

    return String(texto || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        );

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHtml(valor) {

    return String(valor ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =====================================================
   CONVERTER TORNEIOS
===================================================== */

function numeroTorneios(valor) {

    if (
        valor === null ||
        valor === undefined ||
        String(valor).trim() === ""
    ) {

        return null;

    }


    const numero =
        Number(
            String(valor)
                .replace(",", ".")
                .trim()
        );


    if (isNaN(numero)) {

        return null;

    }


    return numero;

}


/* =====================================================
   TORNEIOS VERMELHO
===================================================== */

function classeTorneios(valor) {

    const numero =
        numeroTorneios(valor);


    /*
       0 ou 1 = vermelho
       2 ou mais = normal
    */

    if (
        numero !== null &&
        numero < 2
    ) {

        return "torneios-alerta";

    }


    return "";

}


/* =====================================================
   VERIFICAR CABEÇALHO
===================================================== */

function ehCabecalho(
    linha,
    coluna
) {

    const codigo =
        normalizar(
            linha[coluna]
        );

    const nome =
        normalizar(
            linha[coluna + 1]
        );


    return (
        codigo === "codigo" ||
        nome === "nome"
    );

}


/* =====================================================
   IDENTIFICAR CATEGORIA
===================================================== */

function identificarCategoria(
    valor
) {

    if (
        valor === null ||
        valor === undefined
    ) {

        return "";

    }


    const texto =
        String(valor).trim();


    const encontrada =
        ordemCategorias.find(
            categoria =>
                normalizar(categoria) ===
                normalizar(texto)
        );


    return encontrada || "";

}


/* =====================================================
   ADICIONAR CATEGORIA
===================================================== */

function adicionarCategoria(
    categoria
) {

    if (!categoria) {

        return;

    }


    if (
        !categorias.some(
            item =>
                normalizar(item) ===
                normalizar(categoria)
        )
    ) {

        categorias.push(
            categoria
        );

    }

}


/* =====================================================
   ADICIONAR ATLETA
===================================================== */

function adicionarAtleta(
    linha,
    coluna,
    categoria
) {

    /*
       Se for cabeçalho,
       não adiciona.
    */

    if (
        ehCabecalho(
            linha,
            coluna
        )
    ) {

        return;

    }


    const codigo =
        linha[coluna] || "";


    const nome =
        linha[coluna + 1] || "";


    const clube =
        linha[coluna + 2] || "";


    const categoriaPlanilha =
        linha[coluna + 3] || "";


    const idade =
        linha[coluna + 4] || "";


    const confirmacao =
        linha[coluna + 5] || "";


    const torneios =
        linha[coluna + 6] || "";


    /*
       Linha sem nome = não é atleta
    */

    if (
        !nome ||
        String(nome).trim() === ""
    ) {

        return;

    }


    /*
       Não adicionar cabeçalhos
    */

    const nomeNormalizado =
        normalizar(nome);


    if (
        [
            "nome",
            "codigo",
            "clube",
            "categoria",
            "idade",
            "confirmacao",
            "torneios"
        ].includes(
            nomeNormalizado
        )
    ) {

        return;

    }


    atletas.push({

        codigo:
            codigo,

        nome:
            nome,

        clube:
            clube,

        categoria:
            categoria,

        categoriaPlanilha:
            categoriaPlanilha,

        idade:
            idade,

        confirmacao:
            confirmacao,

        torneios:
            torneios

    });

}


/* =====================================================
   LER GERAL
===================================================== */

function lerGeral(
    sheet
) {

    const linhas =
        XLSX.utils.sheet_to_json(
            sheet,
            {
                header: 1,
                defval: ""
            }
        );


    /*
       IMPORTANTE:

       A:G = FEMININO
       H:N = MASCULINO

       Nós vamos procurar o título
       em TODAS as linhas.

       Mesmo que não existam atletas,
       a categoria será adicionada.
    */


    let categoriaFeminino = "";

    let categoriaMasculino = "";


    for (
        let r = 0;
        r < linhas.length;
        r++
    ) {

        const linha =
            linhas[r];


        /*
           ---------------------------------------------
           FEMININO
           ---------------------------------------------
        */

        const novaCategoriaF =
            identificarCategoria(
                linha[0]
            );


        if (
            novaCategoriaF
        ) {

            categoriaFeminino =
                novaCategoriaF;


            /*
               MUITO IMPORTANTE:

               adiciona a categoria mesmo
               que não tenha nenhum atleta.
            */

            adicionarCategoria(
                categoriaFeminino
            );

        }


        /*
           ---------------------------------------------
           MASCULINO
           ---------------------------------------------
        */

        const novaCategoriaM =
            identificarCategoria(
                linha[7]
            );


        if (
            novaCategoriaM
        ) {

            categoriaMasculino =
                novaCategoriaM;


            /*
               adiciona mesmo que esteja vazio
            */

            adicionarCategoria(
                categoriaMasculino
            );

        }


        /*
           ---------------------------------------------
           ATLETAS FEMININOS
           ---------------------------------------------
        */

        if (
            categoriaFeminino
        ) {

            adicionarAtleta(
                linha,
                0,
                categoriaFeminino
            );

        }


        /*
           ---------------------------------------------
           ATLETAS MASCULINOS
           ---------------------------------------------
        */

        if (
            categoriaMasculino
        ) {

            adicionarAtleta(
                linha,
                7,
                categoriaMasculino
            );

        }

    }

}


/* =====================================================
   LER SUBS
===================================================== */

function lerSubs(
    sheet
) {

    const linhas =
        XLSX.utils.sheet_to_json(
            sheet,
            {
                header: 1,
                defval: ""
            }
        );


    let categoriaFeminino = "";

    let categoriaMasculino = "";


    for (
        let r = 0;
        r < linhas.length;
        r++
    ) {

        const linha =
            linhas[r];


        /*
           FEMININO / MISTA
        */

        const novaCategoriaF =
            identificarCategoria(
                linha[0]
            );


        if (
            novaCategoriaF
        ) {

            categoriaFeminino =
                novaCategoriaF;


            adicionarCategoria(
                categoriaFeminino
            );

        }


        /*
           MASCULINO
        */

        const novaCategoriaM =
            identificarCategoria(
                linha[7]
            );


        if (
            novaCategoriaM
        ) {

            categoriaMasculino =
                novaCategoriaM;


            adicionarCategoria(
                categoriaMasculino
            );

        }


        /*
           ATLETAS FEMININOS / MISTA
        */

        if (
            categoriaFeminino
        ) {

            adicionarAtleta(
                linha,
                0,
                categoriaFeminino
            );

        }


        /*
           ATLETAS MASCULINOS
        */

        if (
            categoriaMasculino
        ) {

            adicionarAtleta(
                linha,
                7,
                categoriaMasculino
            );

        }

    }

}


/* =====================================================
   REMOVER DUPLICADOS
===================================================== */

function removerDuplicados(
    lista
) {

    const mapa =
        new Map();


    lista.forEach(
        atleta => {

            const chave =
                normalizar(
                    atleta.categoria
                ) +
                "|" +
                String(
                    atleta.codigo || ""
                ).trim() +
                "|" +
                normalizar(
                    atleta.nome
                );


            if (
                !mapa.has(chave)
            ) {

                mapa.set(
                    chave,
                    atleta
                );

            }

        }
    );


    return Array.from(
        mapa.values()
    );

}


/* =====================================================
   CRIAR FILTRO
===================================================== */

function criarFiltro() {

    const select =
        document.getElementById(
            "selectCategoria"
        );


    select.innerHTML = `

        <option value="">

            Selecione uma categoria

        </option>

    `;


    /*
       Ordenar conforme a planilha
    */

    categorias.sort(
        (a, b) => {

            const posA =
                ordemCategorias.indexOf(a);

            const posB =
                ordemCategorias.indexOf(b);


            return posA - posB;

        }
    );


    /*
       CRIAR TODAS AS OPÇÕES

       MESMO AS QUE ESTÃO COM 0 ATLETAS.
    */

    categorias.forEach(
        categoria => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                categoria;


            option.textContent =
                categoria;


            select.appendChild(
                option
            );

        }
    );


    console.log(
        "TODAS AS CATEGORIAS:",
        categorias
    );

}


/* =====================================================
   SELECIONAR CATEGORIA
===================================================== */

function selecionarCategoria() {

    categoriaAtual =
        document.getElementById(
            "selectCategoria"
        ).value;


    mostrarCategoria();

}


/* =====================================================
   MOSTRAR CATEGORIA
===================================================== */

function mostrarCategoria() {

    const busca =
        normalizar(
            document.getElementById(
                "busca"
            ).value
        );


    /*
       Nenhuma categoria
    */

    if (
        !categoriaAtual
    ) {

        document.getElementById(
            "titulo"
        ).textContent =
            "Selecione uma categoria";


        document.getElementById(
            "contador"
        ).textContent =
            "0";


        document.getElementById(
            "conteudo"
        ).innerHTML = `

            <div class="vazio">

                Selecione uma categoria acima.

            </div>

        `;


        return;

    }


    /*
       Filtrar somente a categoria
       escolhida.
    */

    let lista =
        atletas.filter(
            atleta =>
                normalizar(
                    atleta.categoria
                ) ===
                normalizar(
                    categoriaAtual
                )
        );


    /*
       Pesquisa
    */

    if (
        busca
    ) {

        lista =
            lista.filter(
                atleta => {

                    const texto =
                        normalizar(
                            [
                                atleta.codigo,
                                atleta.nome,
                                atleta.clube,
                                atleta.categoria,
                                atleta.categoriaPlanilha,
                                atleta.idade,
                                atleta.torneios
                            ].join(" ")
                        );


                    return texto.includes(
                        busca
                    );

                }
            );

    }


    /*
       TÍTULO
    */

    document.getElementById(
        "titulo"
    ).textContent =
        "Inscritos - " +
        categoriaAtual;


    /*
       QUANTIDADE
    */

    document.getElementById(
        "contador"
    ).textContent =
        lista.length;


    /*
       TABELA
    */

    renderizarTabela(
        lista
    );

}


/* =====================================================
   RENDERIZAR TABELA
===================================================== */

function renderizarTabela(
    lista
) {

    const conteudo =
        document.getElementById(
            "conteudo"
        );


    /*
       CATEGORIA SEM ATLETAS
    */

    if (
        lista.length === 0
    ) {

        conteudo.innerHTML = `

            <div class="vazio">

                Nenhum atleta inscrito
                nesta categoria.

            </div>

        `;


        return;

    }


    let html = `

        <div class="categoria">

            <div class="categoria-titulo">

                Inscritos -
                ${escaparHtml(
                    categoriaAtual
                )}

            </div>


            <table>

                <thead>

                    <tr>

                        <th>
                            Código
                        </th>

                        <th>
                            Nome
                        </th>

                        <th>
                            Clube
                        </th>

                        <th>
                            Categoria
                        </th>

                        <th>
                            Idade
                        </th>

                        <th>
                            Torneios
                        </th>

                        <th>
                            Status
                        </th>

                    </tr>

                </thead>


                <tbody>

    `;


    lista.forEach(
        atleta => {

            const classe =
                classeTorneios(
                    atleta.torneios
                );


            html += `

                <tr>

                    <td>
                        ${escaparHtml(
                            atleta.codigo
                        )}
                    </td>


                    <td>

                        <strong>

                            ${escaparHtml(
                                atleta.nome
                            )}

                        </strong>

                    </td>


                    <td>
                        ${escaparHtml(
                            atleta.clube
                        )}
                    </td>


                    <td>
                        ${escaparHtml(
                            atleta.categoriaPlanilha
                        )}
                    </td>


                    <td>
                        ${escaparHtml(
                            atleta.idade
                        )}
                    </td>


                    <td
                        class="${classe}"
                    >

                        ${escaparHtml(
                            atleta.torneios
                        )}

                    </td>


                    <td>
                        ${escaparHtml(
                            atleta.confirmacao
                        )}
                    </td>

                </tr>

            `;

        }
    );


    html += `

                </tbody>

            </table>

        </div>

    `;


    conteudo.innerHTML =
        html;

}


/* =====================================================
   PESQUISA
===================================================== */

document
    .getElementById(
        "busca"
    )
    .addEventListener(
        "input",
        function() {

            mostrarCategoria();

        }
    );


/* =====================================================
   INICIAR
===================================================== */

async function iniciar() {

    try {

        /*
           CARREGAR EXCEL
        */

        const resposta =
            await fetch(
                arquivoExcel +
                "?v=" +
                Date.now()
            );


        if (
            !resposta.ok
        ) {

            throw new Error(
                "Não foi possível carregar o Excel."
            );

        }


        const dados =
            await resposta.arrayBuffer();


        const workbook =
            XLSX.read(
                dados,
                {
                    type: "array"
                }
            );


        console.log(
            "ABAS ENCONTRADAS:",
            workbook.SheetNames
        );


        /*
           LIMPAR
        */

        atletas = [];

        categorias = [];


        /*
           =============================================
           GERAL
        =============================================
        */

        if (
            workbook.SheetNames.includes(
                "Geral"
            )
        ) {

            lerGeral(
                workbook.Sheets[
                    "Geral"
                ]
            );

        }
        else {

            throw new Error(
                "A aba Geral não foi encontrada."
            );

        }


        /*
           =============================================
           SUBS
        =============================================
        */

        if (
            workbook.SheetNames.includes(
                "Subs"
            )
        ) {

            lerSubs(
                workbook.Sheets[
                    "Subs"
                ]
            );

        }


        /*
           REMOVER DUPLICADOS
        */

        atletas =
            removerDuplicados(
                atletas
            );


        /*
           CRIAR FILTRO
        */

        criarFiltro();


        /*
           ESTADO INICIAL
        */

        document.getElementById(
            "titulo"
        ).textContent =
            "Selecione uma categoria";


        document.getElementById(
            "contador"
        ).textContent =
            "0";


        document.getElementById(
            "conteudo"
        ).innerHTML = `

            <div class="vazio">

                Selecione uma categoria acima.

            </div>

        `;


        /*
           CONFERÊNCIA NO CONSOLE
        */

        console.log(
            "TOTAL DE ATLETAS:",
            atletas.length
        );


        console.log(
            "CATEGORIAS ENCONTRADAS:",
            categorias
        );

    }


    catch (
        erro
    ) {

        console.error(
            erro
        );


        document.getElementById(
            "conteudo"
        ).innerHTML = `

            <div class="erro">

                <strong>
                    Erro ao carregar a planilha.
                </strong>
