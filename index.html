<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Interclubes Regional - AABBM</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f5f7;
    color: #172033;
}

header {
    background: #111827;
    color: white;
    padding: 35px 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    margin: 8px 0 0;
    font-size: 18px;
    opacity: .85;
}

.container {
    max-width: 1400px;
    margin: 28px auto;
    padding: 0 18px;
}


/* ================================
   FILTRO
================================ */

.menu {
    background: white;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.botao-todos {
    border: 1px solid #d1d5db;
    background: white;
    color: #172033;
    padding: 12px 18px;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
    margin-bottom: 22px;
}

.botao-todos:hover {
    background: #eef2f7;
}

.botao-todos.ativo {
    background: #0f766e;
    color: white;
    border-color: #0f766e;
}

.label-categoria {
    display: block;
    font-size: 14px;
    font-weight: bold;
    color: #4b5563;
    margin-bottom: 8px;
    text-transform: uppercase;
}

.select-categoria {
    width: 100%;
    max-width: 560px;
    padding: 13px 15px;
    border: 1px solid #9ca3af;
    border-radius: 9px;
    background: white;
    color: #172033;
    font-size: 16px;
    cursor: pointer;
}

.select-categoria:focus {
    outline: none;
    border-color: #0f766e;
}


/* ================================
   RESUMO
================================ */

.resumo {
    background: white;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.resumo h2 {
    margin: 0 0 8px;
    font-size: 28px;
}

.contador {
    font-size: 30px;
    font-weight: bold;
    color: #0f766e;
}

.busca {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    font-size: 16px;
}


/* ================================
   TABELA
================================ */

.categoria {
    background: white;
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 25px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.categoria-titulo {
    background: #374151;
    color: white;
    padding: 15px 18px;
    font-size: 20px;
    font-weight: bold;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #e5e7eb;
    padding: 12px;
    text-align: left;
    font-size: 14px;
}

td {
    padding: 12px;
    border-top: 1px solid #eeeeee;
}

tr:hover {
    background: #f9fafb;
}


/* ================================
   TORNEIOS
================================ */

.torneios-alerta {
    color: red !important;
    font-weight: bold;
}


/* ================================
   MENSAGENS
================================ */

.vazio {
    background: white;
    border-radius: 14px;
    padding: 45px;
    text-align: center;
    color: #555;
}

.carregando {
    background: white;
    border-radius: 14px;
    padding: 45px;
    text-align: center;
}

.erro {
    background: #fee2e2;
    color: #991b1b;
    padding: 20px;
    border-radius: 10px;
}


/* ================================
   CELULAR
================================ */

@media(max-width:700px) {

    header h1 {
        font-size: 24px;
    }

    .container {
        padding: 0 10px;
    }

    .select-categoria {
        max-width: 100%;
    }

    table {
        font-size: 13px;
    }

    th,
    td {
        padding: 8px;
    }

}

</style>

</head>


<body>


<header>

    <h1>🏆 Interclubes Regional</h1>

    <p>AABBM</p>

</header>


<div class="container">


<!-- ================================
     FILTRO
================================ -->

<div class="menu">

    <button
        id="botaoTodos"
        class="botao-todos ativo"
        onclick="mostrarTodos()"
    >

        📋 TODOS OS ATLETAS

    </button>


    <label
        class="label-categoria"
        for="selectCategoria"
    >

        CATEGORIA

    </label>


    <select
        id="selectCategoria"
        class="select-categoria"
        onchange="selecionarCategoria()"
    >

        <option value="TODOS">

            Todos os inscritos

        </option>

    </select>

</div>


<!-- ================================
     RESUMO
================================ -->

<div class="resumo">

    <h2 id="titulo">

        Atletas inscritos

    </h2>


    <div
        class="contador"
        id="contador"
    >

        0

    </div>


    <input
        id="busca"
        class="busca"
        type="text"
        placeholder="🔎 Pesquisar atleta..."
    >

</div>


<!-- ================================
     TABELA
================================ -->

<div id="conteudo">

    <div class="carregando">

        Carregando planilha...

    </div>

</div>


</div>


<script>


/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const arquivoExcel =
    "IC26BT - REGIONAL - AABBM.xlsx";


let todosAtletas = [];

let categoriaAtual = "TODOS";


/* =====================================================
   MAPA DAS CATEGORIAS
===================================================== */

const categorias = {

    "Categoria A": [
        "BTFA",
        "BTMA"
    ],

    "Categoria B": [
        "BTFB",
        "BTMB"
    ],

    "Categoria C": [
        "BTFC",
        "BTMC"
    ],

    "Categoria D": [
        "BTFD",
        "BTMD"
    ],

    "Categoria E": [
        "BTFE",
        "BTME"
    ],

    "Profissional": [
        "BTPRm"
    ]

};


/* =====================================================
   NORMALIZAR
===================================================== */

function normalizar(texto) {

    return String(texto || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        );

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHtml(valor) {

    return String(valor ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   TRANSFORMAR CÓDIGO BT EM CATEGORIA
===================================================== */

function descobrirCategoria(bt) {

    const codigo =
        String(bt || "")
            .trim()
            .toUpperCase();


    for (
        const categoria in categorias
    ) {

        const codigos =
            categorias[categoria];


        const encontrado =
            codigos.some(
                codigoCategoria =>
                    codigoCategoria.toUpperCase()
                    === codigo
            );


        if (encontrado) {

            return categoria;

        }

    }


    return codigo;

}


/* =====================================================
   TORNEIOS
===================================================== */

function numeroTorneios(valor) {

    if (
        valor === null ||
        valor === undefined ||
        String(valor).trim() === ""
    ) {

        return null;

    }


    const numero =
        Number(
            String(valor)
                .replace(",", ".")
                .trim()
        );


    if (
        isNaN(numero)
    ) {

        return null;

    }


    return numero;

}


/* =====================================================
   COR DOS TORNEIOS
===================================================== */

function classeTorneios(valor) {

    const numero =
        numeroTorneios(valor);


    if (
        numero !== null &&
        numero < 2
    ) {

        return "torneios-alerta";

    }


    return "";

}


/* =====================================================
   CARREGAR EXCEL
===================================================== */

async function carregarExcel() {

    try {


        const resposta =
            await fetch(
                arquivoExcel +
                "?v=" +
                Date.now()
            );


        if (
            !resposta.ok
        ) {

            throw new Error(
                "Não foi possível carregar a planilha."
            );

        }


        const dados =
            await resposta.arrayBuffer();


        const workbook =
            XLSX.read(
                dados,
                {
                    type: "array"
                }
            );


        console.log(
            "Abas:",
            workbook.SheetNames
        );


        /* =============================================
           PEGAR ABA LISTA AABB
        ============================================= */

        const nomeAba =
            workbook.SheetNames.find(
                nome =>
                    normalizar(nome)
                    === "lista aabb"
            );


        if (!nomeAba) {

            throw new Error(
                "A aba Lista AABB não foi encontrada."
            );

        }


        const sheet =
            workbook.Sheets[
                nomeAba
            ];


        /* =============================================
           LER COMO MATRIZ
        ============================================= */

        const linhas =
            XLSX.utils.sheet_to_json(
                sheet,
                {
                    header: 1,
                    defval: ""
                }
            );


        if (
            linhas.length < 2
        ) {

            throw new Error(
                "A aba Lista AABB está vazia."
            );

        }


        /* =============================================
           CABEÇALHO
        ============================================= */

        const cabecalho =
            linhas[0];


        console.log(
            "Cabeçalho:",
            cabecalho
        );


        /* =============================================
           LOCALIZAR COLUNAS
        ============================================= */

        const colunaCodigo =
            cabecalho.findIndex(
                coluna =>
                    normalizar(coluna)
                    === "reg. cbt"
            );


        const colunaNome =
            cabecalho.findIndex(
                coluna =>
                    normalizar(coluna)
                    === "nome"
            );


        const colunaSexo =
            cabecalho.findIndex(
                coluna =>
                    normalizar(coluna)
                    === "sexo"
            );


        const colunaClube =
            cabecalho.findIndex(
                coluna =>
                    normalizar(coluna)
                    === "clube"
            );


        const colunaBT =
            cabecalho.findIndex(
                coluna =>
                    normalizar(coluna)
                    === "bt"
            );


        const colunaTorneios =
            cabecalho.findIndex(
                coluna =>
                    normalizar(coluna)
                    ===
                    "torneios jogados (01/2026)"
            );


        console.log(
            "Colunas:",
            {
                codigo: colunaCodigo,
                nome: colunaNome,
                sexo: colunaSexo,
                clube: colunaClube,
                bt: colunaBT,
                torneios: colunaTorneios
            }
        );


        /* =============================================
           VALIDAR
        ============================================= */

        if (
            colunaNome === -1 ||
            colunaBT === -1
        ) {

            throw new Error(
                "Não consegui localizar as colunas Nome e BT da Lista AABB."
            );

        }


        /* =============================================
           TRANSFORMAR ATLETAS
        ============================================= */

        todosAtletas =
            linhas
                .slice(1)

                .map(
                    linha => {

                        const bt =
                            linha[
                                colunaBT
                            ];


                        return {

                            codigo:
                                colunaCodigo >= 0
                                    ? linha[colunaCodigo]
                                    : "",

                            nome:
                                linha[
                                    colunaNome
                                ],

                            sexo:
                                colunaSexo >= 0
                                    ? linha[colunaSexo]
                                    : "",

                            clube:
                                colunaClube >= 0
                                    ? linha[colunaClube]
                                    : "",

                            bt:
                                bt,

                            categoria:
                                descobrirCategoria(
                                    bt
                                ),

                            torneios:
                                colunaTorneios >= 0
                                    ? linha[colunaTorneios]
                                    : ""

                        };

                    }
                )


                .filter(
                    atleta =>
                        atleta.nome &&
                        String(
                            atleta.nome
                        ).trim() !== ""
                );


        console.log(
            "Total de atletas:",
            todosAtletas.length
        );


        console.log(
            "Categorias:",
            todosAtletas.reduce(
                (resultado, atleta) => {

                    resultado[
                        atleta.categoria
                    ] =
                        (
                            resultado[
                                atleta.categoria
                            ] || 0
                        ) + 1;

                    return resultado;

                },
                {}
            )
        );


        /* =============================================
           CRIAR FILTRO
        ============================================= */

        criarFiltro();


        /* =============================================
           MOSTRAR
        ============================================= */

        mostrar();

    }


    catch (erro) {

        console.error(
            erro
        );


        document.getElementById(
            "conteudo"
        ).innerHTML = `

            <div class="erro">

                <strong>
                    Erro ao carregar a planilha.
                </strong>

                <br><br>

                ${escaparHtml(
                    erro.message
                )}

            </div>

        `;

    }

}


/* =====================================================
   CRIAR FILTRO
===================================================== */

function criarFiltro() {

    const select =
        document.getElementById(
            "selectCategoria"
        );


    select.innerHTML = "";


    /* =============================================
       TODOS
    ============================================= */

    const opcaoTodos =
        document.createElement(
            "option"
        );


    opcaoTodos.value =
        "TODOS";


    opcaoTodos.textContent =
        "Todos os inscritos";


    select.appendChild(
        opcaoTodos
    );


    /* =============================================
       CATEGORIAS
    ============================================= */

    Object.keys(
        categorias
    ).forEach(
        categoria => {

            const opcao =
                document.createElement(
                    "option"
                );


            opcao.value =
                categoria;


            opcao.textContent =
                categoria;


            select.appendChild(
                opcao
            );

        }
    );

}


/* =====================================================
   MOSTRAR TODOS
===================================================== */

function mostrarTodos() {

    categoriaAtual =
        "TODOS";


    document.getElementById(
        "selectCategoria"
    ).value =
        "TODOS";


    document.getElementById(
        "botaoTodos"
    ).classList.add(
        "ativo"
    );


    mostrar();

}


/* =====================================================
   SELECIONAR CATEGORIA
===================================================== */

function selecionarCategoria() {

    categoriaAtual =
        document.getElementById(
            "selectCategoria"
        ).value;


    if (
        categoriaAtual ===
        "TODOS"
    ) {

        document.getElementById(
            "botaoTodos"
        ).classList.add(
            "ativo"
        );

    }
    else {

        document.getElementById(
            "botaoTodos"
        ).classList.remove(
            "ativo"
        );

    }


    mostrar();

}


/* =====================================================
   MOSTRAR
===================================================== */

function mostrar() {

    const busca =
        normalizar(
            document.getElementById(
                "busca"
            ).value
        );


    let lista =
        [...todosAtletas];


    /* =============================================
       FILTRAR CATEGORIA
    ============================================= */

    if (
        categoriaAtual !==
        "TODOS"
    ) {

        lista =
            lista.filter(
                atleta =>
                    atleta.categoria ===
                    categoriaAtual
            );

    }


    /* =============================================
       FILTRAR PESQUISA
    ============================================= */

    if (
        busca
    ) {

        lista =
            lista.filter(
                atleta => {

                    const texto =
                        normalizar(
                            [
                                atleta.codigo,
                                atleta.nome,
                                atleta.clube,
                                atleta.categoria,
                                atleta.bt
                            ].join(" ")
                        );


                    return texto.includes(
                        busca
                    );

                }
            );

    }


    /* =============================================
       TÍTULO
    ============================================= */

    if (
        categoriaAtual ===
        "TODOS"
    ) {

        document.getElementById(
            "titulo"
        ).textContent =
            "Atletas inscritos";

    }
    else {

        document.getElementById(
            "titulo"
        ).textContent =
            "Inscritos - " +
            categoriaAtual;

    }


    /* =============================================
       CONTADOR
    ============================================= */

    document.getElementById(
        "contador"
    ).textContent =
        lista.length;


    /* =============================================
       TABELA
    ============================================= */

    renderizarTabela(
        lista
    );

}


/* =====================================================
   RENDERIZAR TABELA
===================================================== */

function renderizarTabela(
    lista
) {

    const conteudo =
        document.getElementById(
            "conteudo"
        );


    if (
        lista.length === 0
    ) {

        conteudo.innerHTML = `

            <div class="vazio">

                Nenhum atleta encontrado.

            </div>

        `;

        return;

    }


    let html = `

        <div class="categoria">

            <div class="categoria-titulo">

                ${
                    categoriaAtual === "TODOS"
                        ? "Atletas inscritos"
                        : "Inscritos - " +
                          escaparHtml(
                              categoriaAtual
                          )
                }

            </div>


            <table>

                <thead>

                    <tr>

                        <th>
                            Código
                        </th>

                        <th>
                            Nome
                        </th>

                        <th>
                            Clube
                        </th>

                        <th>
                            Categoria
                        </th>

                        <th>
                            Sexo
                        </th>

                        <th>
                            Torneios
                        </th>

                    </tr>

                </thead>


                <tbody>

    `;


    lista.forEach(
        atleta => {


            const classe =
                classeTorneios(
                    atleta.torneios
                );


            html += `

                <tr>

                    <td>
                        ${escaparHtml(
                            atleta.codigo
                        )}
                    </td>


                    <td>

                        <strong>

                            ${escaparHtml(
                                atleta.nome
                            )}

                        </strong>

                    </td>


                    <td>
                        ${escaparHtml(
                            atleta.clube
                        )}
                    </td>


                    <td>
                        ${escaparHtml(
                            atleta.categoria
                        )}
                    </td>


                    <td>
                        ${escaparHtml(
                            atleta.sexo
                        )}
                    </td>


                    <td
                        class="${classe}"
                    >

                        ${escaparHtml(
                            atleta.torneios
                        )}

                    </td>

                </tr>

            `;

        }
    );


    html += `

                </tbody>

            </table>

        </div>

    `;


    conteudo.innerHTML =
        html;

}


/* =====================================================
   PESQUISA
===================================================== */

document
    .getElementById(
        "busca"
    )
    .addEventListener(
        "input",
        function() {

            mostrar();

        }
    );


/* =====================================================
   INICIAR
===================================================== */

carregarExcel();

</script>

</body>

</html>
