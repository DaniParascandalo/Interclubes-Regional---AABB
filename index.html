<script>


/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const arquivoExcel =
    "IC26BT - REGIONAL - AABBM.xlsx";


let modo =
    "INSCRITOS";


let categoriaAtual =
    "TODOS_INSCRITOS";


let todosAtletas = [];


let inscritos = [];


let grupos = {};


/* =====================================================
   NORMALIZAR TEXTO
===================================================== */

function normalizar(texto) {

    return String(texto || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

}


/* =====================================================
   VERIFICAR CABEÇALHO
===================================================== */

function ehCabecalho(nome) {

    const n =
        normalizar(nome);

    return (

        n === "nome" ||

        n === "codigo" ||

        n === "clube" ||

        n === "categoria" ||

        n === "idade" ||

        n === "confirmacao" ||

        n === "torneios"

    );

}


/* =====================================================
   IDENTIFICAR CATEGORIA
===================================================== */

function identificarCategoria(linha) {

    for (let i = 0; i < linha.length; i++) {

        const valor =
            String(linha[i] || "").trim();

        const normalizado =
            normalizar(valor);

        if (
            normalizado.match(
                /^categoria\s+[a-z0-9]+$/
            )
        ) {

            return valor;

        }

    }

    return "";

}


/* =====================================================
   NORMALIZAR NOME DA CATEGORIA
===================================================== */

function normalizarCategoria(nome) {

    const texto =
        String(nome || "").trim();

    const match =
        texto.match(
            /^Categoria\s+([A-Za-z0-9]+)/i
        );

    if (match) {

        return "Categoria " +
            match[1].toUpperCase();

    }

    return texto;

}


/* =====================================================
   CONVERTER TORNEIOS
===================================================== */

function numeroTorneios(valor) {

    if (
        valor === null ||
        valor === undefined ||
        valor === ""
    ) {

        return null;

    }

    const numero =
        Number(
            String(valor)
                .replace(",", ".")
                .trim()
        );

    if (isNaN(numero)) {

        return null;

    }

    return numero;

}


/* =====================================================
   CLASSE DOS TORNEIOS
===================================================== */

function classeTorneios(valor) {

    const numero =
        numeroTorneios(valor);

    /*
       0 e 1 ficam vermelhos.
       2 ou mais ficam normais.
    */

    if (
        numero !== null &&
        numero < 2
    ) {

        return "torneios-alerta";

    }

    return "";

}


/* =====================================================
   CARREGAR EXCEL
===================================================== */

async function carregarExcel() {

    try {


        const resposta =
            await fetch(
                arquivoExcel +
                "?v=" +
                Date.now()
            );


        if (!resposta.ok) {

            throw new Error(
                "Excel não encontrado"
            );

        }


        const dados =
            await resposta.arrayBuffer();


        const workbook =
            XLSX.read(
                dados,
                {
                    type: "array"
                }
            );


        console.log(
            "Abas encontradas:",
            workbook.SheetNames
        );


        /* =================================================
           LISTA AABB
        ================================================= */

        if (
            workbook.SheetNames.includes(
                "Lista AABB"
            )
        ) {

            const sheet =
                workbook.Sheets[
                    "Lista AABB"
                ];


            const dadosLista =
                XLSX.utils.sheet_to_json(
                    sheet,
                    {
                        defval: ""
                    }
                );


            todosAtletas =
                dadosLista

                    .map(
                        atleta => ({

                            codigo:
                                atleta["Reg. CBT"] ||
                                atleta["Código"] ||
                                atleta["Codigo"] ||
                                "",


                            nome:
                                atleta["Nome"] ||
                                "",


                            clube:
                                atleta["Clube"] ||
                                "",


                            categoria:
                                atleta["Categoria"] ||
                                "",


                            idade:
                                atleta["Idade"] ||
                                "",


                            torneios:
                                atleta[
                                    "Torneios Jogados (01/2026)"
                                ] ||

                                atleta[
                                    "Torneios"
                                ] ||

                                "",


                            sexo:
                                atleta["Sexo"] ||
                                ""

                        })
                    )


                    .filter(
                        atleta =>

                            atleta.nome &&

                            !ehCabecalho(
                                atleta.nome
                            )

                    );

        }


        /* =================================================
           LIMPAR DADOS ANTERIORES
        ================================================= */

        inscritos = [];

        grupos = {};


        /* =================================================
           LER ABA GERAL
        ================================================= */

        if (
            workbook.SheetNames.includes(
                "Geral"
            )
        ) {

            lerCategorias(
                workbook.Sheets[
                    "Geral"
                ]
            );

        }


        /* =================================================
           LER ABA SUBS
        ================================================= */

        if (
            workbook.SheetNames.includes(
                "Subs"
            )
        ) {

            lerCategorias(
                workbook.Sheets[
                    "Subs"
                ]
            );

        }


        /* =================================================
           CRIAR LISTA DE CATEGORIAS
        ================================================= */

        criarListaCategorias();


        /* =================================================
           MOSTRAR INSCRITOS
        ================================================= */

        mostrar();


    }

    catch(erro) {

        console.error(
            erro
        );


        document.getElementById(
            "conteudo"
        ).innerHTML = `

            <div class="erro">

                <strong>
                    Erro ao carregar a planilha.
                </strong>

                <br><br>

                Verifique se o arquivo está no GitHub:

                <br><br>

                <strong>
                    ${arquivoExcel}
                </strong>

            </div>

        `;

    }

}


/* =====================================================
   LER CATEGORIAS
===================================================== */

function lerCategorias(sheet) {

    const linhas =
        XLSX.utils.sheet_to_json(
            sheet,
            {
                header: 1,
                defval: ""
            }
        );


    let categoriaAtualPlanilha =
        "";


    linhas.forEach(
        linha => {


            /* =========================================
               VERIFICAR SE A LINHA É UMA CATEGORIA
            ========================================= */

            const categoriaEncontrada =
                identificarCategoria(
                    linha
                );


            if (categoriaEncontrada) {

                categoriaAtualPlanilha =
                    normalizarCategoria(
                        categoriaEncontrada
                    );


                if (
                    !grupos[
                        categoriaAtualPlanilha
                    ]
                ) {

                    grupos[
                        categoriaAtualPlanilha
                    ] = [];

                }

                return;

            }


            /* =========================================
               SE NÃO TEM CATEGORIA, IGNORA
            ========================================= */

            if (
                !categoriaAtualPlanilha
            ) {

                return;

            }


            /* =========================================
               BLOCO FEMININO
               A partir da coluna A
            ========================================= */

            adicionarInscrito(
                linha,
                0,
                categoriaAtualPlanilha
            );


            /* =========================================
               BLOCO MASCULINO
               A partir da coluna H
            ========================================= */

            adicionarInscrito(
                linha,
                7,
                categoriaAtualPlanilha
            );

        }
    );

}


/* =====================================================
   ADICIONAR ATLETA INSCRITO
===================================================== */

function adicionarInscrito(
    linha,
    inicio,
    categoria
) {


    const codigo =
        linha[inicio] || "";


    const nome =
        linha[inicio + 1] || "";


    const clube =
        linha[inicio + 2] || "";


    const categoriaLinha =
        linha[inicio + 3] || "";


    const idade =
        linha[inicio + 4] || "";


    const confirmacao =
        linha[inicio + 5] || "";


    const torneios =
        linha[inicio + 6] || "";


    /* =========================================
       NÃO ADICIONAR LINHAS VAZIAS
    ========================================= */

    if (
        !nome ||
        !String(nome).trim()
    ) {

        return;

    }


    /* =========================================
       NÃO ADICIONAR CABEÇALHOS
    ========================================= */

    if (
        ehCabecalho(nome)
    ) {

        return;

    }


    /* =========================================
       NÃO ADICIONAR TEXTOS DE CATEGORIA
    ========================================= */

    if (
        normalizar(nome)
            .startsWith("categoria ")
    ) {

        return;

    }


    /* =========================================
       CRIAR OBJETO
    ========================================= */

    const atleta = {

        codigo:
            codigo,

        nome:
            nome,

        clube:
            clube,

        categoria:
            categoriaLinha ||
            categoria,

        idade:
            idade,

        confirmacao:
            confirmacao,

        torneios:
            torneios,

        grupo:
            categoria

    };


    /* =========================================
       ADICIONAR NO GRUPO
    ========================================= */

    if (
        !grupos[categoria]
    ) {

        grupos[categoria] = [];

    }


    grupos[categoria].push(
        atleta
    );


    /* =========================================
       ADICIONAR NA LISTA GERAL
    ========================================= */

    inscritos.push(
        atleta
    );

}


/* =====================================================
   REMOVER DUPLICADOS
===================================================== */

function removerDuplicados(lista) {

    const mapa =
        new Map();


    lista.forEach(
        atleta => {

            const chave =
                String(
                    atleta.codigo ||
                    atleta.nome
                )
                    .trim()
                    .toLowerCase();


            if (
                chave &&
                !mapa.has(chave)
            ) {

                mapa.set(
                    chave,
                    atleta
                );

            }

        }
    );


    return Array.from(
        mapa.values()
    );

}


/* =====================================================
   CRIAR LISTA DE CATEGORIAS
===================================================== */

function criarListaCategorias() {

    const select =
        document.getElementById(
            "selectCategoria"
        );


    select.innerHTML = `

        <option value="TODOS_INSCRITOS">

            Todos os inscritos

        </option>

    `;


    const categorias =
        Object.keys(
            grupos
        )
            .filter(
                categoria =>
                    grupos[categoria] &&
                    grupos[categoria].length > 0
            )
            .sort(
                (a, b) =>
                    a.localeCompare(
                        b,
                        "pt-BR",
                        {
                            numeric: true
                        }
                    )
            );


    categorias.forEach(
        categoria => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                categoria;


            option.textContent =
                categoria;


            select.appendChild(
                option
            );

        }
    );

}


/* =====================================================
   MOSTRAR TODOS
===================================================== */

function mostrarTodos() {

    modo =
        "TODOS";


    categoriaAtual =
        "TODOS_INSCRITOS";


    document.getElementById(
        "selectCategoria"
    ).value =
        "TODOS_INSCRITOS";


    mostrar();

}


/* =====================================================
   SELECIONAR CATEGORIA
===================================================== */

function selecionarCategoria() {

    const select =
        document.getElementById(
            "selectCategoria"
        );


    categoriaAtual =
        select.value;


    if (
        categoriaAtual ===
        "TODOS_INSCRITOS"
    ) {

        modo =
            "TODOS";

    }
    else {

        modo =
            "INSCRITOS";

    }


    mostrar();

}


/* =====================================================
   MOSTRAR DADOS
===================================================== */

function mostrar() {

    const busca =
        normalizar(
            document.getElementById(
                "busca"
            ).value
        );


    let lista = [];


    /* =========================================
       TODOS OS ATLETAS
    ========================================= */

    if (
        categoriaAtual ===
        "TODOS_INSCRITOS"
    ) {

        lista =
            removerDuplicados(
                todosAtletas
            );

    }

    /* =========================================
       UMA CATEGORIA
    ========================================= */

    else {

        lista =
            removerDuplicados(
                grupos[
                    categoriaAtual
                ] || []
            );

    }


    /* =========================================
       FILTRO DE PESQUISA
    ========================================= */

    if (busca) {

        lista =
            lista.filter(
                atleta => {

                    const texto =
                        normalizar(
                            [
                                atleta.codigo,
                                atleta.nome,
                                atleta.clube,
                                atleta.categoria,
                                atleta.idade,
                                atleta.torneios
                            ].join(" ")
                        );


                    return texto.includes(
                        busca
                    );

                }
            );

    }


    /* =========================================
       TÍTULO
    ========================================= */

    const titulo =
        document.getElementById(
            "titulo"
        );


    if (
        categoriaAtual ===
        "TODOS_INSCRITOS"
    ) {

        titulo.textContent =
            "Atletas inscritos";

    }
    else {

        titulo.textContent =
            "Inscritos - " +
            categoriaAtual;

    }


    /* =========================================
       CONTADOR
    ========================================= */

    document.getElementById(
        "contador"
    ).textContent =
        lista.length;


    /* =========================================
       BOTÃO TODOS
    ========================================= */

    const botaoTodos =
        document.getElementById(
            "botaoTodos"
        );


    if (
        categoriaAtual ===
        "TODOS_INSCRITOS"
    ) {

        botaoTodos.classList.add(
            "ativo"
        );

    }
    else {

        botaoTodos.classList.remove(
            "ativo"
        );

    }


    /* =========================================
       RENDERIZAR
    ========================================= */

    renderizarTabela(
        lista
    );

}


/* =====================================================
   RENDERIZAR TABELA
===================================================== */

function renderizarTabela(
    lista
) {

    const conteudo =
        document.getElementById(
            "conteudo"
        );


    if (
        !lista.length
    ) {

        conteudo.innerHTML = `

            <div class="vazio">

                Nenhum atleta encontrado.

            </div>

        `;

        return;

    }


    let html = `

        <div class="categoria">

            <div class="categoria-titulo">

                ${
                    categoriaAtual ===
                    "TODOS_INSCRITOS"

                    ? "Atletas inscritos"

                    : "Inscritos - " +
                      categoriaAtual
                }

            </div>

            <table>

                <thead>

                    <tr>

                        <th>
                            Código
                        </th>

                        <th>
                            Nome
                        </th>

                        <th>
                            Clube
                        </th>

                        <th>
                            Categoria
                        </th>

                        <th>
                            Idade
                        </th>

                        <th>
                            Torneios
                        </th>

                        <th>
                            Status
                        </th>

                    </tr>

                </thead>

                <tbody>
    `;


    lista.forEach(
        atleta => {

            const classe =
                classeTorneios(
                    atleta.torneios
                );


            const torneios =
                atleta.torneios !== "" &&
                atleta.torneios !== null &&
                atleta.torneios !== undefined

                    ? atleta.torneios

                    : "";


            const status =
                atleta.confirmacao
                    ? atleta.confirmacao
                    : "";


            html += `

                <tr>

                    <td>
                        ${escaparHtml(
                            atleta.codigo
                        )}
                    </td>

                    <td>
                        <strong>
                            ${escaparHtml(
                                atleta.nome
                            )}
                        </strong>
                    </td>

                    <td>
                        ${escaparHtml(
                            atleta.clube
                        )}
                    </td>

                    <td>
                        ${escaparHtml(
                            atleta.categoria
                        )}
                    </td>

                    <td>
                        ${escaparHtml(
                            atleta.idade
                        )}
                    </td>

                    <td class="${classe}">

                        ${escaparHtml(
                            torneios
                        )}

                    </td>

                    <td class="status">

                        ${escaparHtml(
                            status
                        )}

                    </td>

                </tr>

            `;

        }
    );


    html += `

                </tbody>

            </table>

        </div>

    `;


    conteudo.innerHTML =
        html;

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHtml(valor) {

    return String(
        valor ?? ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   PESQUISA
===================================================== */

document
    .getElementById(
        "busca"
    )
