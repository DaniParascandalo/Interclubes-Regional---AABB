<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Interclubes Regional - AABBM</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f5f7;
    color: #172033;
}


/* =========================
   CABEÇALHO
========================= */

header {
    background: #111827;
    color: white;
    padding: 35px 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    margin: 8px 0 0;
    font-size: 18px;
    opacity: .85;
}


/* =========================
   CONTAINER
========================= */

.container {
    max-width: 1250px;
    margin: 28px auto;
    padding: 0 18px;
}


/* =========================
   MENU
========================= */

.menu {
    background: white;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 20px;

    display: flex;
    flex-wrap: wrap;
    gap: 9px;

    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.botao {
    border: 1px solid #d1d5db;
    background: white;
    color: #172033;

    padding: 11px 16px;

    border-radius: 9px;

    font-weight: bold;

    cursor: pointer;
}

.botao:hover {
    background: #eef2f7;
}

.botao.ativo {
    background: #0f766e;
    color: white;
    border-color: #0f766e;
}


/* =========================
   RESUMO
========================= */

.resumo {
    background: white;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 20px;

    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.resumo h2 {
    margin: 0 0 8px;
    font-size: 28px;
}

.contador {
    font-size: 30px;
    font-weight: bold;
    color: #0f766e;
}

.busca {
    width: 100%;

    padding: 14px;

    margin-top: 15px;

    border: 1px solid #d1d5db;

    border-radius: 9px;

    font-size: 16px;
}


/* =========================
   TABELA
========================= */

.categoria {
    background: white;

    border-radius: 14px;

    overflow: hidden;

    margin-bottom: 20px;

    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.categoria-titulo {
    background: #374151;

    color: white;

    padding: 15px 18px;

    font-size: 20px;

    font-weight: bold;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #e5e7eb;

    padding: 12px;

    text-align: left;

    font-size: 14px;
}

td {
    padding: 12px;

    border-top: 1px solid #eeeeee;
}

tr:hover {
    background: #f9fafb;
}


/* =========================
   CONFIRMADO
========================= */

.status {
    color: #047857;
    font-weight: bold;
}


/* =========================
   MENSAGENS
========================= */

.vazio {
    background: white;

    border-radius: 14px;

    padding: 45px;

    text-align: center;

    color: #555;
}

.carregando {
    background: white;

    border-radius: 14px;

    padding: 45px;

    text-align: center;
}

.erro {
    background: #fee2e2;

    color: #991b1b;

    padding: 20px;

    border-radius: 10px;
}


/* =========================
   CELULAR
========================= */

@media(max-width:700px) {

    header h1 {
        font-size: 24px;
    }

    .container {
        padding: 0 10px;
    }

    .botao {
        font-size: 13px;
        padding: 9px 11px;
    }

    table {
        font-size: 13px;
    }

    th,
    td {
        padding: 8px;
    }

}

</style>

</head>


<body>


<!-- =========================
     CABEÇALHO
========================= -->

<header>

    <h1>🏆 Interclubes Regional</h1>

    <p>AABBM</p>

</header>


<div class="container">


<!-- =========================
     MENU
========================= -->

<div class="menu" id="menu">

    <button
        class="botao"
        onclick="selecionar('TODOS', this)"
    >
        📋 TODOS OS ATLETAS
    </button>

</div>


<!-- =========================
     RESUMO
========================= -->

<div class="resumo">

    <h2 id="titulo">
        Atletas inscritos
    </h2>

    <div
        class="contador"
        id="contador"
    >
        0
    </div>

    <input
        id="busca"
        class="busca"
        placeholder="🔎 Pesquisar atleta..."
    >

</div>


<!-- =========================
     CONTEÚDO
========================= -->

<div id="conteudo">

    <div class="carregando">
        Carregando planilha...
    </div>

</div>


</div>


<script>


/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const arquivoExcel =
"IC26BT - REGIONAL - AABBM.xlsx";


let todosAtletas = [];

let inscritos = [];

let grupos = {};

let categoriaAtual = "INSCRITOS";


/* =====================================================
   NORMALIZAR TEXTO
===================================================== */

function normalizar(texto) {

    return String(texto || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

}


/* =====================================================
   VERIFICAR CABEÇALHO
===================================================== */

function ehCabecalho(nome) {

    const n = normalizar(nome);

    return (

        n === "nome" ||

        n === "codigo" ||

        n === "clube" ||

        n === "categoria" ||

        n === "idade" ||

        n === "confirmacao" ||

        n === "torneios"

    );

}


/* =====================================================
   CARREGAR EXCEL
===================================================== */

async function carregarExcel() {

    try {

        const resposta =
            await fetch(
                arquivoExcel +
                "?v=" +
                Date.now()
            );


        if (!resposta.ok) {

            throw new Error(
                "Excel não encontrado"
            );

        }


        const dados =
            await resposta.arrayBuffer();


        const workbook =
            XLSX.read(
                dados,
                {
                    type: "array"
                }
            );


        console.log(
            "Abas encontradas:",
            workbook.SheetNames
        );


        /* =================================================
           LISTA AABB
        ================================================= */

        if (
            workbook.SheetNames.includes(
                "Lista AABB"
            )
        ) {

            const sheet =
                workbook.Sheets[
                    "Lista AABB"
                ];


            const dadosLista =
                XLSX.utils.sheet_to_json(
                    sheet,
                    {
                        defval: ""
                    }
                );


            todosAtletas =
                dadosLista

                    .map(atleta => ({

                        codigo:
                            atleta["Reg. CBT"] || "",

                        nome:
                            atleta["Nome"] || "",

                        categoria:
                            atleta["Categoria"] || "",

                        torneios:
                            atleta[
                                "Torneios Jogados (01/2026)"
                            ] || "",

                        sexo:
                            atleta["Sexo"] || ""

                    }))

                    .filter(
                        atleta =>
                            atleta.nome &&
                            !ehCabecalho(
                                atleta.nome
                            )
                    );

        }


        /* =================================================
           ABA GERAL
        ================================================= */

        if (
            workbook.SheetNames.includes(
                "Geral"
            )
        ) {

            lerCategorias(
                workbook.Sheets["Geral"]
            );

        }


        /* =================================================
           ABA SUBS
        ================================================= */

        if (
            workbook.SheetNames.includes(
                "Subs"
            )
        ) {

            lerCategorias(
                workbook.Sheets["Subs"]
            );

        }


        /* =================================================
           CRIAR BOTÕES
        ================================================= */

        criarBotoes();


        /* =================================================
           MOSTRAR INSCRITOS
        ================================================= */

        mostrar();


    }

    catch(erro) {

        console.error(erro);


        document.getElementById(
            "conteudo"
        ).innerHTML = `

            <div class="erro">

                <strong>
                    Erro ao carregar a planilha.
                </strong>

                <br><br>

                Verifique se o arquivo está no GitHub:

                <br><br>

                <strong>
                    ${arquivoExcel}
                </strong>

            </div>

        `;

    }

}


/* =====================================================
   LER CATEGORIAS
===================================================== */

function lerCategorias(sheet) {

    const linhas =
        XLSX.utils.sheet_to_json(
            sheet,
            {
                header: 1,
                defval: ""
            }
        );


    let categoria = "";


    linhas.forEach(linha => {


        /* ================================================
           IDENTIFICAR CATEGORIA
        ================================================= */

        const primeiraColuna =
            String(
                linha[0] || ""
            ).trim();


        if (
            primeiraColuna.startsWith(
                "Categoria "
            )
        ) {

            categoria =
                primeiraColuna;


            if (
                !grupos[categoria]
            ) {

                grupos[categoria] = [];

            }


            return;

        }


        /* ================================================
           IGNORAR LINHAS ANTES DA CATEGORIA
        ================================================= */

        if (!categoria) {

            return;

        }


        /* ================================================
           PRIMEIRO BLOCO
        ================================================= */

        adicionarInscrito(
            linha,
            0,
            categoria
        );


        /* ================================================
           SEGUNDO BLOCO
        ================================================= */

        adicionarInscrito(
            linha,
            7,
            categoria
        );

    });

}


/* =====================================================
   ADICIONAR INSCRITO
===================================================== */

function adicionarInscrito(
    linha,
    inicio,
    categoria
) {


    const codigo =
        linha[inicio] || "";


    const nome =
        linha[inicio + 1] || "";


    const clube =
        linha[inicio + 2] || "";


    const categoriaLinha =
        linha[inicio + 3] || "";


    const idade =
        linha[inicio + 4] || "";


    const confirmacao =
        linha[inicio + 5] || "";


    const torneios =
        linha[inicio + 6] || "";


    /* ================================================
       SEM NOME = IGNORA
    ================================================= */

    if (
        !String(nome).trim()
    ) {

        return;

    }


    /* ================================================
       IGNORA CABEÇALHO
    ================================================= */

    if (
        ehCabecalho(nome)
    ) {

        return;

    }


    /* ================================================
       PROCURAR NA LISTA AABB
    ================================================= */

    const encontrado =
        todosAtletas.find(
            atleta =>
                normalizar(
                    atleta.nome
                ) ===
                normalizar(
                    nome
                )
        );


    /* ================================================
       CRIAR ATLETA
    ================================================= */

    const atleta = {

        codigo:
            codigo ||
            (
                encontrado
                ? encontrado.codigo
                : ""
            ),


        nome:
            nome,


        clube:
            clube,


        categoria:
            categoriaLinha ||
            (
                encontrado
                ? encontrado.categoria
                : categoria
            ),


        idade:
            idade,


        confirmacao:
            confirmacao,


        torneios:
            torneios ||
            (
                encontrado
                ? encontrado.torneios
                : ""
            )

    };


    /* ================================================
       EVITAR DUPLICADOS
    ================================================= */

    const jaExiste =
        inscritos.some(
            item =>
                normalizar(
                    item.nome
                ) ===
                normalizar(
                    atleta.nome
                )
        );


    if (!jaExiste) {

        inscritos.push(
            atleta
        );

    }


    /* ================================================
       ADICIONAR AO GRUPO
    ================================================= */

    if (
        !grupos[categoria]
    ) {

        grupos[categoria] = [];

    }


    const existeNoGrupo =
        grupos[categoria].some(
            item =>
                normalizar(
                    item.nome
                ) ===
                normalizar(
                    atleta.nome
                )
        );


    if (!existeNoGrupo) {

        grupos[categoria].push(
            atleta
        );

    }

}


/* =====================================================
   CRIAR BOTÕES DAS CATEGORIAS
===================================================== */

function criarBotoes() {

    const menu =
        document.getElementById(
            "menu"
        );


    Object.keys(grupos)
        .forEach(
            categoria => {


                const botao =
                    document.createElement(
                        "button"
                    );


                botao.className =
                    "botao";


                botao.innerText =
                    categoria;


                botao.onclick =
                    function() {

                        selecionar(
                            categoria,
                            this
                        );

                    };


                menu.appendChild(
                    botao
                );

            }
        );

}


/* =====================================================
   SELECIONAR
===================================================== */

function selecionar(
    categoria,
    botao
) {


    categoriaAtual =
        categoria;


    document
        .querySelectorAll(
            ".botao"
        )
        .forEach(
            b =>
                b.classList.remove(
                    "ativo"
                )
        );


    botao.classList.add(
        "ativo"
    );


    document.getElementById(
        "busca"
    ).value = "";


    mostrar();

}


/* =====================================================
   OBTER LISTA
===================================================== */

function obterLista() {


    /* ================================================
       INSCRITOS
    ================================================= */

    if (
        categoriaAtual ===
        "INSCRITOS"
    ) {

        return [
            ...inscritos
        ];

    }


    /* ================================================
       TODOS
    ================================================= */

    if (
        categoriaAtual ===
        "TODOS"
    ) {

        return [
            ...todosAtletas
        ];

    }


    /* ================================================
       CATEGORIA
    ================================================= */

    return [
        ...(grupos[
            categoriaAtual
        ] || [])
    ];

}


/* =====================================================
   MOSTRAR
===================================================== */

function mostrar() {


    let lista =
        obterLista();


    /* ================================================
       PESQUISA
    ================================================= */

    const busca =
        normalizar(
            document.getElementById(
                "busca"
            ).value
        );


    if (busca) {

        lista =
            lista.filter(
                atleta =>

                    normalizar(
                        atleta.nome
                    ).includes(
                        busca
                    )

            );

    }


    /* ================================================
       ORDENAR
    ================================================= */

    lista.sort(
        (a, b) =>

            String(a.nome)
                .localeCompare(
                    String(b.nome),
                    "pt-BR"
                )

    );


    /* ================================================
       CONTADOR
    ================================================= */

    document.getElementById(
        "contador"
    ).innerText =
        lista.length;


    /* ================================================
       TÍTULO
    ================================================= */

    if (
        categoriaAtual ===
        "INSCRITOS"
    ) {

        document.getElementById(
            "titulo"
        ).innerText =
            "Atletas inscritos";

    }

    else if (
        categoriaAtual ===
        "TODOS"
    ) {

        document.getElementById(
            "titulo"
        ).innerText =
            "Todos os atletas";

    }

    else {

        document.getElementById(
            "titulo"
        ).innerText =
            categoriaAtual;

    }


    /* ================================================
       NENHUM RESULTADO
    ================================================= */

    if (!lista.length) {

        document.getElementById(
            "conteudo"
        ).innerHTML = `

            <div class="vazio">

                Nenhum atleta encontrado.

            </div>

        `;

        return;

    }


    /* ================================================
       TABELA
    ================================================= */

    let html = `

        <div class="categoria">

            <div class="categoria-titulo">

                ${
                    categoriaAtual === "INSCRITOS"
                    ? "Atletas inscritos"
                    : categoriaAtual === "TODOS"
                    ? "Todos os atletas"
                    : categoriaAtual
                }

            </div>


            <table>

                <thead>

                    <tr>

                        <th>
                            Código
                        </th>

                        <th>
                            Nome
                        </th>

                        <th>
                            Clube
                        </th>

                        <th>
                            Categoria
                        </th>

                        <th>
                            Idade
                        </th>

                        <th>
                            Torneios
                        </th>

                        ${
                            categoriaAtual !== "TODOS"
                            ? "<th>Status</th>"
                            : ""
                        }

                    </tr>

                </thead>


                <tbody>

    `;


    /* ================================================
       LINHAS
    ================================================= */

    lista.forEach(
        atleta => {


            /*
               SÓ MOSTRA CONFIRMADO
               SE FOR EXATAMENTE "OK"
            */

            const confirmado =
                normalizar(
                    atleta.confirmacao
                ) === "ok";


            html += `

                <tr>

                    <td>
                        ${atleta.codigo || ""}
                    </td>


                    <td>

                        <strong>
                            ${atleta.nome || ""}
                        </strong>

                    </td>


                    <td>
                        ${atleta.clube || "AABBM"}
                    </td>


                    <td>
                        ${atleta.categoria || ""}
                    </td>


                    <td>
                        ${atleta.idade || ""}
                    </td>


                    <td>
                        ${atleta.torneios || ""}
                    </td>


                    ${
                        categoriaAtual !== "TODOS"

                        ?

                        `

                        <td class="${
                            confirmado
                            ? "status"
                            : ""
                        }">

                            ${
                                confirmado
                                ? "● Confirmado"
                                : ""
                            }

                        </td>

                        `

                        :

                        ""
                    }

                </tr>

            `;

        }
    );


    html += `

                </tbody>

            </table>

        </div>

    `;


    document.getElementById(
        "conteudo"
    ).innerHTML =
        html;

}


/* =====================================================
   PESQUISA
===================================================== */

document
    .getElementById(
        "busca"
    )
    .addEventListener(
        "input",
        mostrar
    );


/* =====================================================
   INICIAR
===================================================== */

carregarExcel();


</script>

</body>

</html>
